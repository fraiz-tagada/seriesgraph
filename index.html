function buildLegend(){
  legendEl.innerHTML = "";
  for (const r of ranges){
    const item = document.createElement("div");
    item.className = "leg-item";
    const rangeLabel = `${r.min.toFixed(1)}–${r.max.toFixed(1)}`;
    item.title = `${r.label}: ${rangeLabel}`;
    item.setAttribute("aria-label", `${r.label}, rating ${rangeLabel}`);
    item.innerHTML = `<span class="swatch" style="background:${r.color}"></span><span>${r.label}</span><span class="legend-range">${rangeLabel}</span>`;
    legendEl.appendChild(item);
  }
}

/* =========================
   MODE CARTES
========================= */
function computeSeasonAverages(seasons, rows){
  const S = seasons.length;
  const out = [];

  for (let s=0; s<S; s++){
    const colRaw = rows.map(r => (r && s < r.length) ? r[s] : null);
    const nums = colRaw.filter(v => typeof v === "number" && !Number.isNaN(v));
    const hasUnknown = colRaw.some(v => v === "X");
    const a = nums.length ? (nums.reduce((p,c)=>p+c,0) / nums.length) : null;

    out.push({ title: seasons[s] || `S${s+1}`, avg: a, idx: s, hasUnknown });
  }
  return out;
}

function drawCoverImage(img, x, y, w, h, opacity){
  if (!img) return;
  const s = Math.max(w / img.width, h / img.height);
  const iw = img.width * s;
  const ih = img.height * s;
  const ix = x + (w - iw) / 2;
  const iy = y + (h - ih) / 2;

  activeCtx.save();
  activeCtx.globalAlpha = opacity;
  activeCtx.drawImage(img, ix, iy, iw, ih);
  activeCtx.restore();
}

function drawSeasonCard(x, y, w, h, item, minScore, maxScore){
  activeCtx.save();
  activeCtx.shadowColor = "rgba(0,0,0,.55)";
  activeCtx.shadowBlur = 18;
  activeCtx.shadowOffsetY = 10;

  roundRectPath(x, y, w, h, CARD.radius);
  activeCtx.fillStyle = "rgba(255,255,255,.06)";
  activeCtx.fill();
  activeCtx.restore();

  activeCtx.save();
  roundRectPath(x, y, w, h, CARD.radius);
  activeCtx.clip();

  const bg = cardBgImages[item.idx] || null;
  if (bg) drawCoverImage(bg, x, y, w, h, CARD.bgOpacity);

  activeCtx.fillStyle = "rgba(0,0,0,.25)";
  activeCtx.fillRect(x, y, w, h);

  const g = activeCtx.createLinearGradient(x, y, x+w, y);
  g.addColorStop(0, "rgba(0,0,0,.70)");
  g.addColorStop(0.55, "rgba(0,0,0,.35)");
  g.addColorStop(1, "rgba(0,0,0,.55)");
  activeCtx.fillStyle = g;
  activeCtx.fillRect(x, y, w, h);

  activeCtx.restore();

  const tx = x + CARD.innerPadX;
  const ty = y + h/2;

  activeCtx.save();
  activeCtx.shadowColor = "rgba(0,0,0,0)";
  activeCtx.shadowBlur = 0;
  activeCtx.shadowOffsetX = 0;
  activeCtx.shadowOffsetY = 0;

  activeCtx.font = CARD.titleFont;
  activeCtx.fillStyle = "rgba(255,255,255,.95)";
  activeCtx.textAlign = "left";
  drawTextCentered(item.title, tx, ty);

  const bs = CARD.badgeSize;
  const bx = x + w - CARD.innerPadX - bs;
  const by = y + (h - bs)/2;

  const hasAvg = (typeof item.avg === "number" && !Number.isNaN(item.avg));

  if (!hasAvg && !item.hasUnknown){
    activeCtx.restore();
    return;
  }

  roundRectPath(bx, by, bs, bs, CARD.badgeRadius);

  if (!hasAvg && item.hasUnknown){
    activeCtx.fillStyle = unknown.color;
    activeCtx.fill();

    activeCtx.font = CARD.badgeFont;
    activeCtx.fillStyle = unknown.text;
    activeCtx.textAlign = "center";
    drawTextCentered("?", bx + bs/2, by + bs/2 + 1);

    activeCtx.restore();
    return;
  }

  const shown = Math.round(item.avg * 10) / 10;
  const bucket = pickBucket(shown, minScore, maxScore);

  activeCtx.fillStyle = bucket.color;
  activeCtx.fill();

  activeCtx.font = CARD.badgeFont;
  activeCtx.fillStyle = bucket.text;
  activeCtx.textAlign = "center";
  drawTextCentered(formatScore(shown), bx + bs/2, by + bs/2 + 1);

  activeCtx.restore();
}

/* logo dans carte "filler" + retourne rect complet */
function drawLogoCardInline(x, y, w, h){
  if (!logoImage) return null;

  const { w: lw, h: lh } = getLogoScaledSize();

  const padX = Math.min(LOGO.padX, Math.floor(w * 0.22));
  const padY = 8;

  let dx = Math.round(x + w - padX - lw);
  let dy = Math.round(y + (h - lh) / 2 + LOGO.yBias);

  dx = clamp(dx, x + padY, x + w - lw - padY);
  dy = clamp(dy, y + padY, y + h - lh - padY);

  activeCtx.save();
  activeCtx.shadowColor = "rgba(0,0,0,0)";
  activeCtx.shadowBlur = 0;
  activeCtx.shadowOffsetX = 0;
  activeCtx.shadowOffsetY = 0;

  activeCtx.globalAlpha = LOGO.opacity;
  activeCtx.drawImage(logoImage, dx, dy, lw, lh);
  activeCtx.restore();

  return { x: dx, y: dy, w: lw, h: lh, cardX: x, cardY: y, cardW: w, cardH: h, padX };
}

/* note sous logo dans la carte filler, X indépendant du logo */
function drawSeriesScoreUnderInlineLogo(logoRect, rows){
  const m = measureSeriesScoreBlock(rows);
  if (!m || !logoRect) return false;

  const available = (logoRect.cardY + logoRect.cardH) - (logoRect.y + logoRect.h) - SERIES_FOOT.padY;
  const need = SERIES_FOOT.gapUnderLogo + m.totalH;
  if (available < need) return false;

  const anchorRight = (logoRect.cardX + logoRect.cardW - logoRect.padX);
  let topY = logoRect.y + logoRect.h + SERIES_FOOT.gapUnderLogo;
  topY = clamp(topY, logoRect.cardY + SERIES_FOOT.padY, logoRect.cardY + logoRect.cardH - m.totalH - SERIES_FOOT.padY);

  const xLeft = clamp(anchorRight - m.totalW, logoRect.cardX + 12, logoRect.cardX + logoRect.cardW - 12 - m.totalW);

  const starY = topY + Math.round((m.totalH - SERIES_FOOT.starSize) / 2) - 3;
  const baselineY = topY + m.ascent;

  drawStarIcon(px(xLeft), px(starY), SERIES_FOOT.starSize, "orange");

  activeCtx.save();
  activeCtx.shadowColor = "rgba(0,0,0,0)";
  activeCtx.shadowBlur = 0;
  activeCtx.shadowOffsetX = 0;
  activeCtx.shadowOffsetY = 0;

  const textX = xLeft + SERIES_FOOT.starSize + SERIES_FOOT.gap;

  activeCtx.font = L.fontSeriesScore;
  activeCtx.fillStyle = "rgba(255,255,255,.95)";
  activeCtx.textAlign = "left";
  activeCtx.textBaseline = "alphabetic";
  activeCtx.fillText(m.mainText, px(textX), px(baselineY));

  activeCtx.font = L.fontSeriesScoreSuffix;
  activeCtx.fillStyle = "rgba(255,255,255,.85)";
  activeCtx.fillText(m.suffixText, px(textX + m.mMainW), px(baselineY));

  activeCtx.font = L.fontSeriesMeta;
  activeCtx.fillStyle = "rgba(255,255,255,.55)";
  activeCtx.fillText(m.metaText, px(textX + m.mMainW + m.mSuffixW), px(baselineY));

  activeCtx.restore();

  return true;
}

function renderSeasonalMode(seasons, rows, minScore, maxScore){
  activeCanvas.width = 900;
  const W = activeCanvas.width;

  const cols =
    (W >= CARD.colsMinW)
      ? 2
      : 1;

  const pad = CARD.pad;
  const gap = CARD.gap;

  const cardW =
    (cols === 2)
      ? Math.floor(
          (W - pad * 2 - gap) / 2
        )
      : (W - pad * 2);

  const cardH = CARD.cardH;

  /*
    Cards only contains season cards.
    Logo + global score always live in the same footer
    used by Grid — never inside a spare card.
  */
  const items =
    computeSeasonAverages(
      seasons,
      rows
    );

  const rowsCount =
    Math.ceil(
      items.length / cols
    );

  const cardsBlockH =
    (rowsCount * cardH) +
    (
      Math.max(
        0,
        rowsCount - 1
      ) * gap
    );

  const hasSeriesScore =
    parseSeriesScoreInput() != null;

  const needFooter =
    !!logoImage ||
    hasSeriesScore;

  const footerH =
    computeStandardFooterHeight(rows);

  const footerGap =
    needFooter
      ? FOOTER.gapFromAvg
      : 0;

  const footerTop =
    pad +
    cardsBlockH +
    footerGap;

  const Hneeded =
    footerTop +
    footerH +
    pad;

  activeCanvas.height =
    Math.max(
      Math.ceil(Hneeded),
      420
    );

  const H =
    activeCanvas.height;

  activeCtx.clearRect(
    0,
    0,
    W,
    H
  );

  drawBackground(
    W,
    H
  );

  for (
    let i = 0;
    i < items.length;
    i++
  ){
    const r =
      Math.floor(i / cols);

    const c =
      i % cols;

    const x =
      pad +
      c * (cardW + gap);

    const y =
      pad +
      r * (cardH + gap);

    drawSeasonCard(
      x,
      y,
      cardW,
      cardH,
      items[i],
      minScore,
      maxScore
    );
  }

  if (needFooter){
    const stack =
      !!logoImage &&
      hasSeriesScore;

    const logoRect =
      stack
        ? drawLogoInFooterStacked(
            W,
            footerTop
          )
        : (
            logoImage
              ? drawLogoInFooterCentered(
                  W,
                  footerTop,
                  footerH
                )
              : null
          );

    drawSeriesScoreFooter(
      W,
      footerTop,
      footerH,
      logoRect,
      rows
    );
  }
}

function renderGridMode(seasons, rows, minScore, maxScore){
  const S = seasons.length;
  const E = rows.length;

  const gridWidthNeeded =
    L.leftLabelW +
    (S * L.cellW) +
    (Math.max(0, S - 1) * L.gapX) +
    L.pad * 2;

  activeCanvas.width = Math.max(900, gridWidthNeeded);

  const gridH = (E * L.cellH) + (Math.max(0, E - 1) * L.gapY);
  const t = clamp((E - FLEX.fewEp) / 10, 0, 1);
  const topExtra = Math.round(FLEX.topMin + (FLEX.topMax - FLEX.topMin) * t);

  const gridTop = L.pad + topExtra;
  const gridX0 = L.pad + L.leftLabelW;
  const gridY0 = gridTop + L.topLabelH;

  const avgY = gridY0 + gridH + AVG.gapFromGrid;

  const hasSeriesScore = (parseSeriesScoreInput() != null);
  const needFooter = !!logoImage || hasSeriesScore;

  const m = hasSeriesScore ? measureSeriesScoreBlock(rows) : null;
  const { h: logoH } = getLogoScaledSize();

  let footerH = FOOTER.minH;
  if (needFooter){
    if (logoImage && hasSeriesScore && m){
      footerH = Math.max(
        FOOTER.minH,
        SERIES_FOOT.stackTopPad + logoH + SERIES_FOOT.gapUnderLogo + m.totalH + SERIES_FOOT.padY
      );
    } else if (logoImage){
      footerH = Math.max(FOOTER.minH, logoH + SERIES_FOOT.padY*2);
    } else if (hasSeriesScore && m){
      footerH = Math.max(FOOTER.minH, m.totalH + SERIES_FOOT.padY*2);
    }
  }

  const footerTop = avgY + AVG.blockH + FOOTER.gapFromAvg;
  const Hneeded = footerTop + footerH + L.pad;
  activeCanvas.height = Math.max(Math.ceil(Hneeded), 420);

  const W = activeCanvas.width;
  const H = activeCanvas.height;

  activeCtx.clearRect(0,0,W,H);
  drawBackground(W,H);

  activeCtx.save();
  activeCtx.shadowColor = "rgba(0,0,0,0)";
  activeCtx.shadowBlur = 0;
  activeCtx.shadowOffsetX = 0;
  activeCtx.shadowOffsetY = 0;

  activeCtx.font = L.fontAxis;
  activeCtx.fillStyle = "#ffffff";
  activeCtx.textAlign = "center";

  for (let s = 0; s < S; s++){
    const x = gridX0 + s * (L.cellW + L.gapX) + L.cellW / 2;
    const y = gridTop + L.topLabelH / 2;
    drawTextCentered(seasons[s] || ("S" + (s+1)), x, y);
  }

  activeCtx.textAlign = "left";
  for (let e = 0; e < E; e++){
    const x = L.pad;
    const y = gridY0 + e * (L.cellH + L.gapY) + L.cellH / 2;
    drawTextCentered("E" + (e+1), x, y);
  }

  activeCtx.restore();

  for (let e = 0; e < E; e++){
    for (let s = 0; s < S; s++){
      const raw = (rows[e] && s < rows[e].length) ? rows[e][s] : null;
      if (raw == null) continue;

      const isUnknown = (raw === "X");
      const bucket = isUnknown ? unknown : pickBucket(raw, minScore, maxScore);

      const x = gridX0 + s * (L.cellW + L.gapX);
      const y = gridY0 + e * (L.cellH + L.gapY);

      activeCtx.fillStyle = bucket.color;
      roundRectPath(x, y, L.cellW, L.cellH, L.r);
      activeCtx.fill();

      activeCtx.font = L.fontCell;
      activeCtx.fillStyle = bucket.text;
      activeCtx.textAlign = "center";

      const txt = isUnknown ? "?" : formatScore(Number(raw));
      drawTextCentered(txt, x + L.cellW/2, y + L.cellH/2 + 2);
    }
  }

  activeCtx.font = L.fontAvgLabel;
  activeCtx.fillStyle = "#ffffff";
  activeCtx.textAlign = "left";
  drawTextCentered("AVG.", L.pad, avgY);

  for (let s = 0; s < S; s++){
    const col = rows
      .map(r => (r && s < r.length) ? r[s] : null)
      .filter(v => v !== "X");

    const a = avg(col);
    const x = gridX0 + s * (L.cellW + L.gapX);

    if (a != null) {
      const shown = Number(a.toFixed(1));
      activeCtx.font = L.fontAvg;
      activeCtx.fillStyle = "#ffffff";
      activeCtx.textAlign = "center";
      drawTextCentered(formatScore(shown), x + L.cellW/2, avgY - 6);

      const b = pickBucket(shown, minScore, maxScore);
      const barY = avgY + AVG.barOffset;
      activeCtx.fillStyle = b.color;
      roundRectPath(x, barY, L.cellW, AVG.barH, 999);
      activeCtx.fill();
    }
  }

  const stack = !!logoImage && hasSeriesScore;
  const logoRect = stack
    ? drawLogoInFooterStacked(W, footerTop)
    : (logoImage ? drawLogoInFooterCentered(W, footerTop, footerH) : null);

  drawSeriesScoreFooter(W, footerTop, footerH, logoRect, rows);
}

function renderGridInvertedMode(seasons, rows, minScore, maxScore){
  const S = seasons.length;
  const E = rows.length;

  /*
    Inverted layout:
    - episodes become columns;
    - seasons become rows;
    - the canvas grows horizontally with episode count;
    - season averages are displayed at the right.
  */
  const avgRightGap = 42;
  const avgLabelW = 92;
  const avgBarW = 7;
  const rightReserve = avgRightGap + avgLabelW + avgBarW + 26;

  const gridW =
    (E * L.cellW) +
    (Math.max(0, E - 1) * L.gapX);

  const gridWidthNeeded =
    L.pad +
    L.leftLabelW +
    gridW +
    rightReserve +
    L.pad;

  activeCanvas.width = Math.max(900, Math.ceil(gridWidthNeeded));

  const gridH =
    (S * L.cellH) +
    (Math.max(0, S - 1) * L.gapY);

  /*
    In inverted mode the number of seasons controls vertical size,
    while episode count controls horizontal size.
  */
  const t = clamp((S - 5) / 8, 0, 1);
  const topExtra = Math.round(
    FLEX.topMin +
    (FLEX.topMax - FLEX.topMin) * t
  );

  const gridTop = L.pad + topExtra;
  const gridX0 = L.pad + L.leftLabelW;
  const gridY0 = gridTop + L.topLabelH;

  const avgX =
    gridX0 +
    gridW +
    avgRightGap;

  const hasSeriesScore =
    parseSeriesScoreInput() != null;

  const needFooter =
    !!logoImage ||
    hasSeriesScore;

  const m =
    hasSeriesScore
      ? measureSeriesScoreBlock(rows)
      : null;

  const { h: logoH } =
    getLogoScaledSize();

  let footerH = FOOTER.minH;

  if (needFooter){
    if (logoImage && hasSeriesScore && m){
      footerH = Math.max(
        FOOTER.minH,
        SERIES_FOOT.stackTopPad +
        logoH +
        SERIES_FOOT.gapUnderLogo +
        m.totalH +
        SERIES_FOOT.padY
      );
    } else if (logoImage){
      footerH = Math.max(
        FOOTER.minH,
        logoH + SERIES_FOOT.padY * 2
      );
    } else if (hasSeriesScore && m){
      footerH = Math.max(
        FOOTER.minH,
        m.totalH + SERIES_FOOT.padY * 2
      );
    }
  }

  const footerTop =
    gridY0 +
    gridH +
    FOOTER.gapFromAvg +
    14;

  const Hneeded =
    footerTop +
    footerH +
    L.pad;

  activeCanvas.height =
    Math.max(
      Math.ceil(Hneeded),
      420
    );

  const W = activeCanvas.width;
  const H = activeCanvas.height;

  activeCtx.clearRect(0, 0, W, H);
  drawBackground(W, H);

  /* =========================
     AXIS LABELS
  ========================= */

  activeCtx.save();

  activeCtx.shadowColor = "rgba(0,0,0,0)";
  activeCtx.shadowBlur = 0;
  activeCtx.shadowOffsetX = 0;
  activeCtx.shadowOffsetY = 0;

  activeCtx.font = L.fontAxis;
  activeCtx.fillStyle = "#ffffff";

  /* Episodes along the top */
  activeCtx.textAlign = "center";

  for (let e = 0; e < E; e++){
    const x =
      gridX0 +
      e * (L.cellW + L.gapX) +
      L.cellW / 2;

    const y =
      gridTop +
      L.topLabelH / 2;

    drawTextCentered(
      "E" + (e + 1),
      x,
      y
    );
  }

  /* Seasons down the left */
  activeCtx.textAlign = "left";

  for (let s = 0; s < S; s++){
    const x = L.pad;

    const y =
      gridY0 +
      s * (L.cellH + L.gapY) +
      L.cellH / 2;

    drawTextCentered(
      seasons[s] || ("S" + (s + 1)),
      x,
      y
    );
  }

  /* AVG. header at the right */
  activeCtx.font = L.fontAvgLabel;
  activeCtx.fillStyle = "rgba(255,255,255,.82)";
  activeCtx.textAlign = "left";

  drawTextCentered(
    "AVG.",
    avgX,
    gridTop + L.topLabelH / 2
  );

  activeCtx.restore();

  /* =========================
     CELLS
  ========================= */

  for (let s = 0; s < S; s++){
    for (let e = 0; e < E; e++){
      const raw =
        (rows[e] && s < rows[e].length)
          ? rows[e][s]
          : null;

      if (raw == null) continue;

      const isUnknown =
        raw === "X";

      const bucket =
        isUnknown
          ? unknown
          : pickBucket(
              raw,
              minScore,
              maxScore
            );

      const x =
        gridX0 +
        e * (L.cellW + L.gapX);

      const y =
        gridY0 +
        s * (L.cellH + L.gapY);

      activeCtx.fillStyle =
        bucket.color;

      roundRectPath(
        x,
        y,
        L.cellW,
        L.cellH,
        L.r
      );

      activeCtx.fill();

      activeCtx.font =
        L.fontCell;

      activeCtx.fillStyle =
        bucket.text;

      activeCtx.textAlign =
        "center";

      const txt =
        isUnknown
          ? "?"
          : formatScore(Number(raw));

      drawTextCentered(
        txt,
        x + L.cellW / 2,
        y + L.cellH / 2 + 2
      );
    }
  }

  /* =========================
     SEASON AVERAGES ON RIGHT
  ========================= */

  for (let s = 0; s < S; s++){
    const col =
      rows
        .map(
          r =>
            (r && s < r.length)
              ? r[s]
              : null
        )
        .filter(v => v !== "X");

    const a = avg(col);

    if (a == null) continue;

    const shown =
      Number(a.toFixed(1));

    const rowCenterY =
      gridY0 +
      s * (L.cellH + L.gapY) +
      L.cellH / 2;

    activeCtx.font =
      L.fontAvg;

    activeCtx.fillStyle =
      "#ffffff";

    activeCtx.textAlign =
      "left";

    drawTextCentered(
      formatScore(shown),
      avgX,
      rowCenterY
    );

    const bucket =
      pickBucket(
        shown,
        minScore,
        maxScore
      );

    /*
      Vertical equivalent of the horizontal average bar
      used in the default grid.
    */
    const barX =
      avgX +
      52;

    const barH =
      Math.max(
        18,
        L.cellH - 10
      );

    const barY =
      rowCenterY -
      barH / 2;

    activeCtx.fillStyle =
      bucket.color;

    roundRectPath(
      barX,
      barY,
      avgBarW,
      barH,
      999
    );

    activeCtx.fill();
  }

  /* =========================
     SAME FOOTER / LOGO LOGIC
     AS DEFAULT GRID
  ========================= */

  const stack =
    !!logoImage &&
    hasSeriesScore;

  const logoRect =
    stack
      ? drawLogoInFooterStacked(
          W,
          footerTop
        )
      : (
          logoImage
            ? drawLogoInFooterCentered(
                W,
                footerTop,
                footerH
              )
            : null
        );

  drawSeriesScoreFooter(
    W,
    footerTop,
    footerH,
    logoRect,
    rows
  );
}

function renderGridWrappedMode(seasons, rows, minScore, maxScore){
  activeCanvas.width = WRAPPED.canvasW;
  const W = activeCanvas.width;

  const cols = WRAPPED.cols;

  const sections = [];

  for (let s = 0; s < seasons.length; s++){
    const episodes = [];

    for (let e = 0; e < rows.length; e++){
      const raw =
        (rows[e] && s < rows[e].length)
          ? rows[e][s]
          : null;

      if (raw == null) continue;

      episodes.push({
        episodeIndex: e,
        raw,
        value:
          raw === "X"
            ? null
            : Number(raw)
      });
    }

    const numericValues =
      episodes
        .map(ep => ep.value)
        .filter(
          v =>
            typeof v === "number" &&
            Number.isFinite(v)
        );

    const seasonAvg =
      numericValues.length
        ? numericValues.reduce((a, b) => a + b, 0) /
          numericValues.length
        : null;

    const rowCount =
      Math.max(
        1,
        Math.ceil(episodes.length / cols)
      );

    const cardsH =
      rowCount * WRAPPED.cellH +
      Math.max(0, rowCount - 1) * WRAPPED.gapY;

    const blockH =
      WRAPPED.titleH +
      WRAPPED.titleToCards +
      cardsH;

    sections.push({
      seasonIndex: s,
      episodes,
      avg: seasonAvg,
      rowCount,
      cardsH,
      blockH
    });
  }

  const hasSeriesScore =
    parseSeriesScoreInput() != null;

  const needFooter =
    !!logoImage ||
    hasSeriesScore;

  const scoreMetrics =
    hasSeriesScore
      ? measureSeriesScoreBlock(rows)
      : null;

  const { h: logoH } =
    getLogoScaledSize();

  let footerH = 0;

  if (needFooter){
    if (logoImage && hasSeriesScore && scoreMetrics){
      footerH = Math.max(
        FOOTER.minH,
        SERIES_FOOT.stackTopPad +
        logoH +
        SERIES_FOOT.gapUnderLogo +
        scoreMetrics.totalH +
        SERIES_FOOT.padY
      );
    } else if (logoImage){
      footerH = Math.max(
        FOOTER.minH,
        logoH + SERIES_FOOT.padY * 2
      );
    } else if (hasSeriesScore && scoreMetrics){
      footerH = Math.max(
        FOOTER.minH,
        scoreMetrics.totalH +
        SERIES_FOOT.padY * 2
      );
    }
  }

  const sectionsH =
    sections.reduce(
      (sum, section) =>
        sum + section.blockH,
      0
    ) +
    Math.max(
      0,
      sections.length - 1
    ) * WRAPPED.sectionGap;

  const footerTop =
    WRAPPED.padTop +
    sectionsH +
    (needFooter ? WRAPPED.footerGap : 0);

  const Hneeded =
    footerTop +
    footerH +
    L.pad;

  activeCanvas.height =
    Math.max(
      Math.ceil(Hneeded),
      420
    );

  const H = activeCanvas.height;

  activeCtx.clearRect(0, 0, W, H);
  drawBackground(W, H);

  let cursorY =
    WRAPPED.padTop;

  for (const section of sections){
    const s =
      section.seasonIndex;

    /* Season title */
    const title =
      `Season ${s + 1}`;

    activeCtx.save();

    activeCtx.shadowColor =
      "rgba(0,0,0,.88)";
    activeCtx.shadowBlur = 7;
    activeCtx.shadowOffsetY = 1;

    activeCtx.font =
      WRAPPED.seasonFont;

    activeCtx.textAlign =
      "left";

    activeCtx.textBaseline =
      "alphabetic";

    activeCtx.fillStyle =
      "rgba(255,255,255,.97)";

    const titleBaseline =
      cursorY + 30;

    activeCtx.fillText(
      title,
      WRAPPED.padX,
      titleBaseline
    );

    const titleWidth =
      activeCtx.measureText(title).width;

    if (
      typeof section.avg === "number" &&
      Number.isFinite(section.avg)
    ){
      const shownAvg =
        Math.round(section.avg * 10) / 10;

      activeCtx.font =
        WRAPPED.avgFont;

      activeCtx.fillStyle =
        "rgba(255,255,255,.72)";

      activeCtx.shadowColor =
        "rgba(0,0,0,.94)";
      activeCtx.shadowBlur = 6;

      activeCtx.fillText(
        ` (avg ${formatScore(shownAvg)})`,
        WRAPPED.padX + titleWidth + 3,
        titleBaseline
      );
    }

    activeCtx.restore();

    /* Episode cards */
    const cardsY =
      cursorY +
      WRAPPED.titleH +
      WRAPPED.titleToCards;

    section.episodes.forEach(
      (episode, index) => {
        const row =
          Math.floor(index / cols);

        const col =
          index % cols;

        const x =
          WRAPPED.padX +
          col *
            (WRAPPED.cellW + WRAPPED.gapX);

        const y =
          cardsY +
          row *
            (WRAPPED.cellH + WRAPPED.gapY);

        const isUnknown =
          episode.raw === "X";

        const bucket =
          isUnknown
            ? unknown
            : pickBucket(
                episode.value,
                minScore,
                maxScore
              );

        activeCtx.fillStyle =
          bucket.color;

        roundRectPath(
          x,
          y,
          WRAPPED.cellW,
          WRAPPED.cellH,
          WRAPPED.radius
        );

        activeCtx.fill();

        const textColor =
          isUnknown
            ? unknown.text
            : bucket.text;

        const whiteLike =
          String(textColor).toLowerCase().includes("255,255,255") ||
          String(textColor).toLowerCase() === "#ffffff";

        activeCtx.save();

        if (whiteLike){
          activeCtx.shadowColor =
            "rgba(0,0,0,.38)";
          activeCtx.shadowBlur = 2;
          activeCtx.shadowOffsetY = 1;
        }

        activeCtx.fillStyle =
          textColor;

        activeCtx.font =
          WRAPPED.epFont;

        activeCtx.textAlign =
          "left";

        activeCtx.textBaseline =
          "alphabetic";

        activeCtx.globalAlpha =
          0.76;

        activeCtx.fillText(
          `E${episode.episodeIndex + 1}`,
          x + 8,
          y + 25
        );

        activeCtx.globalAlpha = 1;

        activeCtx.font =
          WRAPPED.scoreFont;

        activeCtx.textAlign =
          "right";

        activeCtx.textBaseline =
          "alphabetic";

        const scoreText =
          isUnknown
            ? "?"
            : formatScore(
                Number(episode.value)
              );

        activeCtx.fillText(
          scoreText,
          x + WRAPPED.cellW - 10,
          y + WRAPPED.cellH - 10
        );

        activeCtx.restore();
      }
    );

    cursorY +=
      section.blockH +
      WRAPPED.sectionGap;
  }

  /*
    Same logo + global score footer logic as the normal Grid.
  */
  if (needFooter){
    const stack =
      !!logoImage &&
      hasSeriesScore;

    const logoRect =
      stack
        ? drawLogoInFooterStacked(
            W,
            footerTop
          )
        : (
            logoImage
              ? drawLogoInFooterCentered(
                  W,
                  footerTop,
                  footerH
                )
              : null
          );

    drawSeriesScoreFooter(
      W,
      footerTop,
      footerH,
      logoRect,
      rows
    );
  }
}



/* =========================
   GRAPH MODE
========================= */
function graphNumericValue(raw){
  if (typeof raw === "number" && Number.isFinite(raw)){
    return clamp(raw, MIN_SCORE, MAX_SCORE);
  }
  return null;
}

function buildEpisodeTimeline(seasons, rows){
  const points = [];
  const spans = [];

  for (let s = 0; s < seasons.length; s++){
    const start = points.length;

    for (let e = 0; e < rows.length; e++){
      const raw =
        rows[e] && s < rows[e].length
          ? rows[e][s]
          : null;

      // null / NA = aucun épisode à cet emplacement.
      if (raw == null) continue;

      points.push({
        seasonIndex: s,
        episodeIndex: e,
        season: seasons[s] || `S${s + 1}`,
        episode: e + 1,
        raw,
        value: graphNumericValue(raw)
      });
    }

    const end = points.length - 1;

    if (end >= start){
      spans.push({
        seasonIndex: s,
        season: seasons[s] || `S${s + 1}`,
        start,
        end
      });
    }
  }

  return { points, spans };
}

function computeGraphYDomain(values){
  const nums = values.filter(
    v => typeof v === "number" && Number.isFinite(v)
  );

  if (!nums.length){
    return { min: 6, max: 10, step: 1 };
  }

  const lowest = Math.min(...nums);

  /*
    Le graphe de référence garde généralement une fenêtre
    assez lisible autour des notes réellement utilisées.
    On descend sous 6 uniquement si les données l’exigent.
  */
  let min = Math.min(Math.floor(lowest), 6);
  min = clamp(min, MIN_SCORE, 9);

  const max = 10;
  const span = max - min;
  const step = span > 6 ? 2 : 1;

  return { min, max, step };
}

function makeGraphScales(count, yDomain){
  const plotW = GRAPH.W - GRAPH.left - GRAPH.right;
  const plotH = GRAPH.H - GRAPH.top - GRAPH.bottom;

  const x = index => {
    if (count <= 1){
      return GRAPH.left + plotW / 2;
    }
    return GRAPH.left + (index / (count - 1)) * plotW;
  };

  const y = value => {
    const t =
      (value - yDomain.min) /
      (yDomain.max - yDomain.min || 1);

    return GRAPH.top + (1 - t) * plotH;
  };

  return { x, y, plotW, plotH };
}

function drawGraphBase(yDomain){
  const plotRight = GRAPH.W - GRAPH.right;
  const plotBottom = GRAPH.H - GRAPH.bottom;

  activeCtx.save();

  activeCtx.font =
    "600 11px -apple-system,system-ui,Segoe UI,Roboto,Arial";

  activeCtx.textAlign = "right";
  activeCtx.textBaseline = "middle";

  for (
    let value = Math.ceil(yDomain.min);
    value <= yDomain.max;
    value += yDomain.step
  ){
    const t =
      (value - yDomain.min) /
      (yDomain.max - yDomain.min || 1);

    const yy =
      GRAPH.top +
      (1 - t) *
        (GRAPH.H - GRAPH.top - GRAPH.bottom);

    activeCtx.beginPath();
    activeCtx.moveTo(GRAPH.left, yy);
    activeCtx.lineTo(plotRight, yy);
    activeCtx.strokeStyle = GRAPH.gridColor;
    activeCtx.lineWidth = 1;
    activeCtx.setLineDash([4, 4]);
    activeCtx.stroke();

    activeCtx.setLineDash([]);
    activeCtx.fillStyle = GRAPH.labelColor;
    activeCtx.fillText(
      String(value),
      GRAPH.left - 8,
      yy
    );
  }

  activeCtx.beginPath();
  activeCtx.moveTo(GRAPH.left, GRAPH.top);
  activeCtx.lineTo(GRAPH.left, plotBottom);
  activeCtx.lineTo(plotRight, plotBottom);

  activeCtx.strokeStyle = GRAPH.axisColor;
  activeCtx.lineWidth = 1;
  activeCtx.stroke();

  activeCtx.restore();
}

function drawSeasonBandsAndLabels(spans, xScale, pointCount){
  if (!spans.length || !pointCount) return;

  const plotBottom = GRAPH.H - GRAPH.bottom;
  const plotH = plotBottom - GRAPH.top;

  activeCtx.save();

  spans.forEach((span, idx) => {
    const firstX = xScale(span.start);
    const lastX = xScale(span.end);

    let left =
      span.start === 0
        ? GRAPH.left
        : (xScale(span.start - 1) + firstX) / 2;

    let right =
      span.end === pointCount - 1
        ? GRAPH.W - GRAPH.right
        : (lastX + xScale(span.end + 1)) / 2;

    if (idx % 2 === 1){
      activeCtx.fillStyle = GRAPH.seasonBand;
      activeCtx.fillRect(
        left,
        GRAPH.top,
        Math.max(0, right - left),
        plotH
      );
    }

    const center = (left + right) / 2;

    activeCtx.font =
      "600 11px -apple-system,system-ui,Segoe UI,Roboto,Arial";
    activeCtx.textAlign = "center";
    activeCtx.textBaseline = "top";
    activeCtx.fillStyle = GRAPH.labelColor;

    activeCtx.fillText(
      span.season,
      center,
      plotBottom + 9
    );
  });

  activeCtx.restore();
}

function splitNumericSegments(points){
  const segments = [];
  let current = [];

  for (const point of points){
    if (
      point &&
      typeof point.y === "number" &&
      Number.isFinite(point.y)
    ){
      current.push(point);
    } else {
      if (current.length){
        segments.push(current);
        current = [];
      }
    }
  }

  if (current.length){
    segments.push(current);
  }

  return segments;
}

function drawSmoothPath(points, strokeStyle, lineWidth, opacity = 1){
  if (!points || points.length < 2) return;

  activeCtx.save();
  activeCtx.strokeStyle = strokeStyle;
  activeCtx.lineWidth = lineWidth;
  activeCtx.globalAlpha = opacity;
  activeCtx.lineCap = "round";
  activeCtx.lineJoin = "round";

  activeCtx.beginPath();
  activeCtx.moveTo(points[0].x, points[0].y);

  if (points.length === 2){
    activeCtx.lineTo(points[1].x, points[1].y);
  } else {
    /*
      Catmull-Rom -> Bézier cubique.
      Cela reproduit le comportement visuel du SVG de référence
      sans dépendance externe comme D3.
    */
    for (let i = 0; i < points.length - 1; i++){
      const p0 = points[i - 1] || points[i];
      const p1 = points[i];
      const p2 = points[i + 1];
      const p3 = points[i + 2] || p2;

      const cp1x = p1.x + (p2.x - p0.x) / 6;
      const cp1y = p1.y + (p2.y - p0.y) / 6;

      const cp2x = p2.x - (p3.x - p1.x) / 6;
      const cp2y = p2.y - (p3.y - p1.y) / 6;

      activeCtx.bezierCurveTo(
        cp1x,
        cp1y,
        cp2x,
        cp2y,
        p2.x,
        p2.y
      );
    }
  }

  activeCtx.stroke();
  activeCtx.restore();
}

function gaussianTrend(values, radius = 3, sigma = 1.65){
  /*
    L’algorithme exact du site source n’est pas disponible dans
    le HTML rendu. Cette version utilise un lissage gaussien
    centré, adapté aux séries de notes épisodiques.

    - les épisodes X sont ignorés dans le calcul ;
    - leur position temporelle reste conservée ;
    - le résultat est nettement plus stable qu’une simple
      moyenne mobile rectangulaire.
  */
  const out = new Array(values.length).fill(null);

  for (let i = 0; i < values.length; i++){
    let weighted = 0;
    let totalWeight = 0;

    for (
      let j = Math.max(0, i - radius);
      j <= Math.min(values.length - 1, i + radius);
      j++
    ){
      const v = values[j];

      if (
        typeof v !== "number" ||
        !Number.isFinite(v)
      ){
        continue;
      }

      const d = j - i;
      const w =
        Math.exp(
          -(d * d) /
          (2 * sigma * sigma)
        );

      weighted += v * w;
      totalWeight += w;
    }

    if (totalWeight > 0){
      out[i] = weighted / totalWeight;
    }
  }

  return out;
}


function weightedMovingTrend(values, windowSize = 7, decay = 0.78){
  /*
    Tendance locale pondérée : chaque point résume les dernières notes
    disponibles dans une fenêtre courte. Les épisodes récents pèsent
    davantage que les anciens, ce qui rend la courbe réactive sans
    reproduire tous les zigzags de la ligne brute.

    - fenêtre épisodes : 7 positions ;
    - poids exponentiels : 1, decay, decay², ... ;
    - X / null sont ignorés dans la moyenne mais gardent leur position.
  */
  const out = new Array(values.length).fill(null);

  for (let i = 0; i < values.length; i++){
    let weighted = 0;
    let totalWeight = 0;
    const from = Math.max(0, i - windowSize + 1);

    for (let j = from; j <= i; j++){
      const v = values[j];
      if (typeof v !== "number" || !Number.isFinite(v)) continue;

      const age = i - j;
      const w = Math.pow(decay, age);
      weighted += v * w;
      totalWeight += w;
    }

    if (totalWeight > 0){
      out[i] = weighted / totalWeight;
    }
  }

  return out;
}

function drawEpisodeDots(points, scales){
  activeCtx.save();

  for (let i = 0; i < points.length; i++){
    const point = points[i];

    if (
      typeof point.value !== "number" ||
      !Number.isFinite(point.value)
    ){
      continue;
    }

    const x = scales.x(i);
    const y = scales.y(point.value);
    const bucket = pickBucket(
      point.value,
      MIN_SCORE,
      MAX_SCORE
    );

    activeCtx.beginPath();
    activeCtx.arc(
      x,
      y,
      GRAPH.dotR,
      0,
      Math.PI * 2
    );

    activeCtx.fillStyle = bucket.color;
    activeCtx.fill();

    activeCtx.strokeStyle = "rgba(0,0,0,.75)";
    activeCtx.lineWidth = 1.5;
    activeCtx.stroke();
  }

  activeCtx.restore();
}

function renderEpisodicGraph(seasons, rows){
  activeCanvas.width = GRAPH.W;

  const graphHasFooter =
    !!logoImage ||
    parseSeriesScoreInput() != null;

  const graphFooterH =
    computeStandardFooterHeight(rows);

  activeCanvas.height =
    GRAPH.H +
    (graphHasFooter
      ? GRAPH_FOOTER.gapAbove
      : 0) +
    graphFooterH;

  activeCtx.clearRect(
    0,
    0,
    activeCanvas.width,
    activeCanvas.height
  );

  drawGraphBackground(
    activeCanvas.width,
    activeCanvas.height
  );

  const { points, spans } =
    buildEpisodeTimeline(seasons, rows);

  const values =
    points.map(p => p.value);

  const yDomain =
    computeGraphYDomain(values);

  const scales =
    makeGraphScales(
      points.length,
      yDomain
    );

  /* zones et labels des saisons */
  drawSeasonBandsAndLabels(
    spans,
    scales.x,
    points.length
  );

  /* axes + grille */
  drawGraphBase(yDomain);

  /* =========================
     LIGNE ÉPISODES
  ========================= */

  const rawCanvasPoints =
    points.map(
      (point, index) =>
        point.value == null
          ? null
          : {
              x: scales.x(index),
              y: scales.y(point.value)
            }
    );

  if (!graphHidePoints){
    for (
      const segment of
      splitNumericSegments(rawCanvasPoints)
    ){
      drawSmoothPath(
        segment,
        GRAPH.rawLineColor,
        GRAPH.rawLineWidth,
        1
      );
    }

    /* points individuels */
    drawEpisodeDots(
      points,
      scales
    );
  }

  /* =========================
     TRENDLINE
  ========================= */

  if (
    graphTrendline &&
    points.length > 1
  ){
    const smoothed =
      weightedMovingTrend(values, 7, 0.78);

    const trendPoints =
      smoothed.map(
        (value, index) =>
          value == null
            ? null
            : {
                x: scales.x(index),
                y: scales.y(value)
              }
      );

    for (
      const segment of
      splitNumericSegments(trendPoints)
    ){
      drawSmoothPath(
        segment,
        GRAPH.trendColor,
        GRAPH.trendWidth,
        0.72
      );
    }
  }

  /* =========================
     FOOTER
  ========================= */

  drawGraphSeriesFooter(rows);
}

function renderSeasonalGraph(seasons, rows){
activeCanvas.width = GRAPH.W;

const graphHasFooter =
  !!logoImage ||
  parseSeriesScoreInput() != null;

const graphFooterH =
  computeStandardFooterHeight(rows);

activeCanvas.height =
  GRAPH.H +
  (graphHasFooter ? GRAPH_FOOTER.gapAbove : 0) +
  graphFooterH;

  activeCtx.clearRect(
    0,
    0,
    activeCanvas.width,
    activeCanvas.height
  );

drawGraphBackground(
  activeCanvas.width,
  activeCanvas.height
);

  const items = computeSeasonAverages(
    seasons,
    rows
  ).filter(
    item =>
      typeof item.avg === "number" &&
      Number.isFinite(item.avg)
  );

  const values = items.map(item => item.avg);

  const yDomain = computeGraphYDomain(values);

  const scales = makeGraphScales(
    items.length,
    yDomain
  );

  drawGraphBase(yDomain);

  const plotBottom = GRAPH.H - GRAPH.bottom;

  /* =========================
     LABELS S1 / S2 / S3...
  ========================= */

  activeCtx.save();

  activeCtx.font =
    "600 11px -apple-system,system-ui,Segoe UI,Roboto,Arial";

  activeCtx.textAlign = "center";
  activeCtx.textBaseline = "top";
  activeCtx.fillStyle = GRAPH.labelColor;

  items.forEach((item, index) => {
    activeCtx.fillText(
      item.title,
      scales.x(index),
      plotBottom + 9
    );
  });

  activeCtx.restore();


  /* =========================
     LIGNE NORMALE ENTRE SAISONS
  ========================= */

  const rawPoints = items.map(
    (item, index) => ({
      x: scales.x(index),
      y: scales.y(item.avg)
    })
  );

  if (!graphHidePoints && rawPoints.length > 1){
    drawSmoothPath(
      rawPoints,
      GRAPH.rawLineColor,
      GRAPH.rawLineWidth,
      1
    );
  }


  /* =========================
     TRENDLINE
  ========================= */

  if (graphTrendline && values.length > 1){

    /*
      En vue saisonnière, même logique à une échelle adaptée :
      tendance pondérée sur les 3 dernières moyennes de saison.
      La saison la plus récente pèse davantage.
    */
    const trendValues =
      weightedMovingTrend(values, 3, 0.65);

    const trendPoints = trendValues.map(
      (value, index) => ({
        x: scales.x(index),
        y: scales.y(value)
      })
    );

    drawSmoothPath(
      trendPoints,
      GRAPH.trendColor,
      GRAPH.trendWidth,
      0.72
    );
  }


  /* =========================
     POINTS + NOTES
  ========================= */

  if (!graphHidePoints){
    activeCtx.save();

    items.forEach((item, index) => {

      const shown =
        Math.round(item.avg * 10) / 10;

      const bucket = pickBucket(
        shown,
        MIN_SCORE,
        MAX_SCORE
      );

      const x = scales.x(index);
      const y = scales.y(shown);


      /* POINT */

      activeCtx.beginPath();

      activeCtx.arc(
        x,
        y,
        GRAPH.seasonDotR,
        0,
        Math.PI * 2
      );

      activeCtx.fillStyle = bucket.color;
      activeCtx.fill();

      activeCtx.strokeStyle =
        "rgba(0,0,0,.75)";

      activeCtx.lineWidth = 2;
      activeCtx.stroke();


      /* NOTE */

      activeCtx.font =
        "700 13px -apple-system,system-ui,Segoe UI,Roboto,Arial";

      activeCtx.textAlign = "center";
      activeCtx.textBaseline = "bottom";

      activeCtx.fillStyle = bucket.color;

      activeCtx.shadowColor =
        "rgba(0,0,0,.95)";

      activeCtx.shadowBlur = 4;

      activeCtx.fillText(
        formatScore(shown),
        x,
        y - 13
      );

      activeCtx.shadowBlur = 0;
    });

    activeCtx.restore();
  }


/* Logo + note globale sous le graphique */

drawGraphSeriesFooter(rows);
}

/* =========================
   GRAPH FOOTER
========================= */
function drawGraphSeriesFooter(rows){
  const hasSeriesScore =
    parseSeriesScoreInput() != null;

  const needFooter =
    !!logoImage ||
    hasSeriesScore;

  if (!needFooter){
    return;
  }

  const W =
    activeCanvas.width;

  /*
    Same spacing and layout contract as Grid:
    content -> FOOTER.gapFromAvg -> footer.
  */
  const footerTop =
    GRAPH.H +
    FOOTER.gapFromAvg;

  const footerH =
    computeStandardFooterHeight(rows);

  const stack =
    !!logoImage &&
    hasSeriesScore;

  const logoRect =
    stack
      ? drawLogoInFooterStacked(
          W,
          footerTop
        )
      : (
          logoImage
            ? drawLogoInFooterCentered(
                W,
                footerTop,
                footerH
              )
            : null
        );

  drawSeriesScoreFooter(
    W,
    footerTop,
    footerH,
    logoRect,
    rows
  );
}



function syncSegmentedIndicator(){
  const selector = document.getElementById("modeSelector");
  if (!selector) return;

  const active = selector.querySelector("button.active");
  if (!active) return;

  const selectorRect = selector.getBoundingClientRect();
  const activeRect = active.getBoundingClientRect();

  selector.style.setProperty(
    "--segment-indicator-x",
    `${activeRect.left - selectorRect.left}px`
  );
  selector.style.setProperty(
    "--segment-indicator-w",
    `${activeRect.width}px`
  );
}

function syncDisplayUI(){
  const buttons = [
    gridModeBtn,
    cardModeBtn,
    graphModeBtn
  ];

  for (const button of buttons){
    button.classList.toggle(
      "active",
      button.dataset.mode === displayMode
    );
  }

  syncSegmentedIndicator();

  gridOptions.classList.toggle(
    "hidden",
    displayMode !== "grid"
  );

  graphOptions.classList.toggle(
    "hidden",
    displayMode !== "graph"
  );

  cardOptions.classList.toggle(
    "hidden",
    displayMode !== "cards"
  );

  gridWrappedBtn.setAttribute(
    "aria-checked",
    gridWrapped ? "true" : "false"
  );

  trendlineBtn.setAttribute(
    "aria-checked",
    graphTrendline ? "true" : "false"
  );
}

/* =========================
   UI helpers
========================= */
function syncSeasonDropdown(seasons){
  const current = cardBgSeason.value;
  cardBgSeason.innerHTML = "";
  for (let i=0; i<seasons.length; i++){
    const opt = document.createElement("option");
    opt.value = String(i);
    opt.textContent = seasons[i] || `S${i+1}`;
    cardBgSeason.appendChild(opt);
  }
  if (current && Number(current) < seasons.length) cardBgSeason.value = current;
}

function render(){
  buildLegend();

  if (activeCanvas !== canvas){
    activeCanvas = canvas;
    activeCtx = ctx;
  }

  const { seasons, rows } = parseCSV(csvEl.value);

  if (cardBgImages.length !== seasons.length){
    const next = new Array(seasons.length).fill(null);
    for (let i=0;i<Math.min(cardBgImages.length, next.length);i++) next[i] = cardBgImages[i];
    cardBgImages = next;
  }

  syncSeasonDropdown(seasons);
  syncDisplayUI();

  if (displayMode === "graph"){
    if (graphView === "seasonal"){
      renderSeasonalGraph(seasons, rows);
    } else {
      renderEpisodicGraph(seasons, rows);
    }
  } else if (displayMode === "cards"){
    renderSeasonalMode(seasons, rows, MIN_SCORE, MAX_SCORE);
  } else {
    if (gridWrapped){
      renderGridWrappedMode(
        seasons,
        rows,
        MIN_SCORE,
        MAX_SCORE
      );
    } else if (gridView === "inverted"){
      renderGridInvertedMode(
        seasons,
        rows,
        MIN_SCORE,
        MAX_SCORE
      );
    } else {
      renderGridMode(
        seasons,
        rows,
        MIN_SCORE,
        MAX_SCORE
      );
    }
  }
}

function exportPNG(){
  const scale = EXPORT_SCALE;

  const src = canvas;
  const exportCanvas = document.createElement("canvas");
  exportCanvas.width = Math.round(src.width * scale);
  exportCanvas.height = Math.round(src.height * scale);

  const ectx = exportCanvas.getContext("2d", { alpha: true });

  ectx.setTransform(scale, 0, 0, scale, 0, 0);
  ectx.imageSmoothingEnabled = true;
  ectx.imageSmoothingQuality = "high";
  ectx.drawImage(src, 0, 0);

  const filename =
    displayMode === "graph"
      ? (graphView === "seasonal"
          ? "series_graph_seasonal.png"
          : "series_graph_episodic.png")
      : displayMode === "cards"
        ? "series_cards.png"
        : gridWrapped
          ? "series_grid_wrapped.png"
          : gridView === "inverted"
            ? "series_grid_inverted.png"
            : "series_grid.png";

  exportCanvas.toBlob((blob) => {
    if (!blob) return;

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;

    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }, "image/png");
}

function fileToImage(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = (e) => { URL.revokeObjectURL(url); reject(e); };
    img.src = url;
  });
}

/* =========================
   IMDb / OMDb IMPORT
========================= */

function setImdbStatus(message, isError = false){
  imdbStatusEl.textContent = message;
  imdbStatusEl.dataset.error = String(isError);
}

function extractImdbId(value){
  const match = String(value)
    .trim()
    .match(/\btt\d{7,}\b/i);

  if (!match){
    throw new Error(
      "Enter a valid IMDb series ID, for example tt0903747."
    );
  }

  return match[0].toLowerCase();
}

async function omdbRequest(parameters){
  if (
    !OMDB_API_KEY ||
    OMDB_API_KEY === "PUT_YOUR_OMDB_API_KEY_HERE"
  ){
    throw new Error(
      "Add your OMDb API key to OMDB_API_KEY."
    );
  }

  const url = new URL("https://www.omdbapi.com/");
  url.searchParams.set("apikey", OMDB_API_KEY);

  for (const [key, value] of Object.entries(parameters)){
    if (value !== undefined && value !== null){
      url.searchParams.set(key, String(value));
    }
  }

  let response;

  try{
    response = await fetch(url.toString(), {
      method: "GET",
      headers: {
        Accept: "application/json"
      }
    });
  }catch(error){
    throw new Error(
      "Could not connect to OMDb. Check your connection and API key."
    );
  }

  if (!response.ok){
    throw new Error(
      `OMDb request failed with HTTP status ${response.status}.`
    );
  }

  let data;

  try{
    data = await response.json();
  }catch(error){
    throw new Error(
      "OMDb returned an invalid JSON response."
    );
  }

  if (!data || data.Response === "False"){
    throw new Error(
      data?.Error || "OMDb returned no data."
    );
  }

  return data;
}

function normalizeOmdbRating(value){
  if (typeof value !== "string"){
    return null;
  }

  const normalized = value.trim();

  if (
    normalized === "" ||
    normalized.toUpperCase() === "N/A"
  ){
    return null;
  }

  const rating = Number.parseFloat(normalized);

  if (
    !Number.isFinite(rating) ||
    rating < MIN_SCORE ||
    rating > MAX_SCORE
  ){
    return null;
  }

  return rating.toFixed(1);
}

function buildOmdbMatrix(seasons, mode){
  const processedSeasons = seasons
    .map(season => {
      const episodes = Array.isArray(season.episodes)
        ? season.episodes
            .map(episode => {
              const episodeNumber = Number.parseInt(
                episode.Episode,
                10
              );

              if (
                !Number.isInteger(episodeNumber) ||
                episodeNumber < 1
              ){
                return null;
              }

              return {
                episodeNumber,
                rating: normalizeOmdbRating(
                  episode.imdbRating
                )
              };
            })
            .filter(Boolean)
            .sort(
              (a, b) =>
                a.episodeNumber - b.episodeNumber
            )
        : [];

      return {
        seasonNumber: season.seasonNumber,
        episodes
      };
    })
    .filter(
      season =>
        Number.isInteger(season.seasonNumber) &&
        season.episodes.length > 0
    )
    .sort(
      (a, b) =>
        a.seasonNumber - b.seasonNumber
    );

  if (processedSeasons.length === 0){
    throw new Error(
      "OMDb returned no numbered episodes for this series."
    );
  }

  const maximumEpisodeNumber = Math.max(
    ...processedSeasons.flatMap(
      season =>
        season.episodes.map(
          episode => episode.episodeNumber
        )
    )
  );

  const episodeMaps = processedSeasons.map(
    season =>
      new Map(
        season.episodes.map(
          episode => [
            episode.episodeNumber,
            episode
          ]
        )
      )
  );

  const lines = [
    processedSeasons
      .map(
        season => `S${season.seasonNumber}`
      )
      .join(",")
  ];

  for (
    let episodeNumber = 1;
    episodeNumber <= maximumEpisodeNumber;
    episodeNumber += 1
  ){
    const row = processedSeasons.map(
      (season, seasonIndex) => {
        const episode = episodeMaps[
          seasonIndex
        ].get(episodeNumber);

        /*
  No episode exists at this position in this season.
  Leave the CSV cell empty.
*/
if (!episode){
  return "";
}

/*
  Empty-template mode marks every existing episode
  as unknown.
*/
if (mode === "E"){
  return "X";
}

/*
  The episode exists, but OMDb has no rating.
  Display it as an unknown episode.
*/
return episode.rating ?? "X";
      }
    );

    lines.push(row.join(","));
  }

  return lines.join("\n");
}

async function fetchSeriesFromOmdb(){
  if (fetchImdbBtn.disabled){
    return;
  }

  const previousButtonText =
    fetchImdbBtn.textContent;

  try{
    fetchImdbBtn.disabled = true;
    fetchImdbBtn.textContent = "Fetching…";

    setImdbStatus("Checking the series…");

    const imdbId = extractImdbId(
      imdbSeriesIdEl.value
    );

    const mode =
      imdbOutputModeEl.value === "E"
        ? "E"
        : "N";

    const series = await omdbRequest({
      i: imdbId,
      plot: "short"
    });

    if (
      typeof series.Type === "string" &&
      !["series", "episode"].includes(
        series.Type.toLowerCase()
      )
    ){
      throw new Error(
        "The IMDb ID does not appear to belong to a television series."
      );
    }

    const totalSeasons = Number.parseInt(
      series.totalSeasons,
      10
    );

    if (
      !Number.isInteger(totalSeasons) ||
      totalSeasons < 1
    ){
      throw new Error(
        "OMDb did not return a valid season count for this title."
      );
    }

    const seasons = [];
    const failedSeasons = [];

    for (
      let seasonNumber = 1;
      seasonNumber <= totalSeasons;
      seasonNumber += 1
    ){
      setImdbStatus(
        `Fetching season ${seasonNumber} of ${totalSeasons}…`
      );

      try{
        const seasonData = await omdbRequest({
          i: imdbId,
          Season: seasonNumber
        });

        const episodes =
          Array.isArray(seasonData.Episodes)
            ? seasonData.Episodes
            : [];

        if (episodes.length === 0){
          failedSeasons.push(seasonNumber);
          continue;
        }

        seasons.push({
          seasonNumber,
          episodes
        });
      }catch(error){
        failedSeasons.push(seasonNumber);

        console.warn(
          `Could not load season ${seasonNumber}:`,
          error
        );
      }
    }

    if (seasons.length === 0){
      throw new Error(
        "OMDb did not return any usable seasons."
      );
    }

    const output = buildOmdbMatrix(
      seasons,
      mode
    );

    /*
      This is the correct integration point for
      the rest of your application.
    */
    csvEl.value = output;

    /*
      Programmatically setting textarea.value does
      not fire an input event, so render() must be
      called explicitly.
    */
    render();

    const loadedEpisodeCount = seasons.reduce(
      (total, season) =>
        total + season.episodes.length,
      0
    );

    let message =
      `Loaded ${series.Title || imdbId}: ` +
      `${seasons.length} season` +
      `${seasons.length === 1 ? "" : "s"}, ` +
      `${loadedEpisodeCount} episode` +
      `${loadedEpisodeCount === 1 ? "" : "s"}.`;

    if (failedSeasons.length > 0){
      message +=
        ` Could not load season` +
        `${failedSeasons.length === 1 ? "" : "s"} ` +
        `${failedSeasons.join(", ")}.`;
    }

    setImdbStatus(message);
  }catch(error){
    console.error(
      "IMDb/OMDb import failed:",
      error
    );

    setImdbStatus(
      error instanceof Error
        ? error.message
        : "An unexpected import error occurred.",
      true
    );
  }finally{
    fetchImdbBtn.disabled = false;
    fetchImdbBtn.textContent =
      previousButtonText || "Fetch episodes";
  }
}

let modeTransitionTimer = null;

function switchDisplayMode(nextMode){
  if (nextMode === displayMode) return;

  const reduceMotion = window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches;

  if (modeTransitionTimer){
    clearTimeout(modeTransitionTimer);
    modeTransitionTimer = null;
  }

  if (reduceMotion){
    displayMode = nextMode;
    syncDisplayUI();
    render();
    return;
  }

  canvas.classList.add("mode-switch-out");

  modeTransitionTimer = window.setTimeout(() => {
    displayMode = nextMode;
    syncDisplayUI();
    render();

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        canvas.classList.remove("mode-switch-out");
      });
    });

    modeTransitionTimer = null;
  }, 80);
}

<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Grid notes (fidèle + export + fond + logo + mode seasonal/film) — iOS friendly</title>

  <style>
    :root{
      --bg:#05070d;
      --panel: rgba(255,255,255,.07);
      --border: rgba(255,255,255,.16);
      --text: rgba(255,255,255,.94);
      --muted: rgba(255,255,255,.66);

      --glass-hi: rgba(255,255,255,.15);
      --glass-mid: rgba(255,255,255,.085);
      --glass-low: rgba(255,255,255,.045);
      --glass-stroke: rgba(255,255,255,.18);
      --glass-shadow: rgba(0,0,0,.28);
      --accent:#0A84FF;

      --tap: 44px;
      --sheetPad: 12px;
      --sheetRadius: 18px;
    }

    html,body{
      height:100%;
      margin:0;
      color:var(--text);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      background:
        radial-gradient(900px 560px at 18% -8%, rgba(255,255,255,.065), transparent 62%),
        radial-gradient(760px 520px at 92% 8%, rgba(76,125,210,.07), transparent 64%),
        linear-gradient(180deg,#101319 0%,#0b0e13 46%,#080a0e 100%);
      background-attachment:fixed;
    }

    .wrap{
      max-width:980px;
      margin:0 auto;
      padding:18px;
      padding-bottom: calc(18px + env(safe-area-inset-bottom));
    }

    .ui{
      position:relative;
      overflow:hidden;
      isolation:isolate;

      border:1px solid rgba(255,255,255,.075);
      background:rgba(255,255,255,.022);

      border-radius:22px;
      padding:14px;
      margin-bottom:14px;

      -webkit-backdrop-filter:
        blur(40px)
        saturate(185%)
        brightness(1.06);

      backdrop-filter:
        blur(40px)
        saturate(185%)
        brightness(1.06);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.09),
        inset 0 -1px 0 rgba(255,255,255,.012),
        0 10px 28px rgba(0,0,0,.14);
    }

    .ui::before{
      content:"";
      position:absolute;
      inset:0;
      z-index:-1;
      pointer-events:none;
      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,.075) 0%,
          rgba(255,255,255,.025) 18%,
          transparent 42%
        );
    }

    .ui::after{
      content:"";
      position:absolute;
      inset:1px;
      z-index:-1;
      pointer-events:none;
      border-radius:21px;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.015);
    }

    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:space-between
    }
    .left,.right{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center
    }

    button{
      min-height:var(--tap);
      border:1px solid rgba(255,255,255,.075);
      background:rgba(255,255,255,.028);
      color:var(--text);
      border-radius:12px;
      padding:8px 11px;
      font-weight:700;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      touch-action:manipulation;
      user-select:none;

      -webkit-backdrop-filter:blur(24px) saturate(165%);
      backdrop-filter:blur(24px) saturate(165%);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.055),
        0 2px 8px rgba(0,0,0,.07);

      transition:
        background 140ms ease,
        border-color 140ms ease,
        transform 100ms ease;
    }

    button:hover{
      background:rgba(255,255,255,.05);
      border-color:rgba(255,255,255,.11);
    }
    button:active{
      transform:translateY(1px) scale(.992);
      box-shadow:
        inset 0 1px 4px rgba(0,0,0,.10),
        0 2px 7px rgba(0,0,0,.10);
    }

    .ghost{
      background:rgba(255,255,255,.016);
    }

    .switch{display:flex;align-items:center;gap:10px}
    .switch span{color:var(--muted);font-weight:700;font-size:13px}

    .mode-group{
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
    }

    .mode-primary-row{
      display:flex;
      align-items:center;
      justify-content:flex-start;
      gap:10px;
      width:100%;
    }

    .mode-primary-row #exportBtn{
      margin-left:0;
      white-space:nowrap;
      flex:0 0 auto;
    }

    .mode-label{
      color:var(--muted);
      font-size:13px;
      font-weight:700;
    }

    .segmented{
      display:flex;
      align-items:center;
      gap:2px;
      padding:3px;
      border:1px solid rgba(255,255,255,.065);
      border-radius:13px;
      background:rgba(0,0,0,.08);

      -webkit-backdrop-filter:blur(22px) saturate(160%);
      backdrop-filter:blur(22px) saturate(160%);

      box-shadow:inset 0 1px 0 rgba(255,255,255,.025);
    }

    .segmented button{
      min-height:36px;
      padding:6px 14px;
      border:0;
      border-radius:9px;
      background:transparent;
      color:var(--muted);
      font-size:14px;
      font-weight:750;
      transition:background 160ms ease,color 160ms ease;
    }

    .segmented button:hover{color:var(--text);}

    .segmented button.active{
      color:#fff;
      background:rgba(255,255,255,.095);
      border-color:rgba(255,255,255,.09);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.05),
        0 1px 4px rgba(0,0,0,.08);
    }

    .view-options{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      width:100%;
      margin-top:2px;
    }

    .data-section{
      margin-top:14px;
      padding:12px;
      border:1px solid rgba(255,255,255,.05);
      border-radius:16px;
      background:rgba(255,255,255,.012);

      -webkit-backdrop-filter:blur(28px) saturate(165%);
      backdrop-filter:blur(28px) saturate(165%);
    }

    .data-section .legend{
      margin-top:0;
      margin-bottom:10px;
    }

    .toggle{
      width:69px;
      height:20px;
      border-radius:999px;
      border:1px solid var(--border);
      background: rgba(255,255,255,.14);
      position:relative;
      padding:0;
      cursor:pointer;
      transition: background-color 180ms ease, border-color 180ms ease;
    }

    .toggle[aria-checked="true"]{
      background:
        linear-gradient(180deg, rgba(38,155,255,.98), rgba(10,132,255,.90));
      border-color:rgba(92,177,255,.88);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.28),
        0 4px 12px rgba(10,132,255,.20);
    }

    .thumb{
      width:22px;
      height:22px;
      border-radius:999px;
      background:#ffffff;
      position:absolute;
      top:50%;
      left:3px;
      transform:translateY(-50%);
      transition:left 180ms cubic-bezier(.4,0,.2,1);
    }
    .toggle[aria-checked="true"] .thumb{left:42px;}

    .legend{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      align-items:center;
      margin-top:10px
    }
    .leg-item{
      display:flex;
      align-items:center;
      gap:7px;
      font-size:13px;
      color:var(--muted);
      font-weight:700
    }
    .swatch{
      width:14px;height:14px;border-radius:4px;
      border:1px solid rgba(255,255,255,.18)
    }

    textarea{
      width:100%;
      min-height:140px;
      box-sizing:border-box;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.06);
      background:rgba(0,0,0,.10);
      color:var(--text);
      padding:12px;
      outline:none;
      font:575 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      margin-top:10px;

      -webkit-backdrop-filter:blur(18px) saturate(150%);
      backdrop-filter:blur(18px) saturate(150%);

      box-shadow:inset 0 1px 0 rgba(255,255,255,.018);
    }

    textarea:focus,
    .smallInput:focus,
    .imdb-loader input[type="text"]:focus,
    select:focus{
      border-color:rgba(10,132,255,.52);
      box-shadow:0 0 0 3px rgba(10,132,255,.10);
    }

    .hint{color:var(--muted);font-size:13px;line-height:1.35;margin:8px 0 0}

    label{
      color:var(--muted);
      font-size:13px;
      font-weight:700;
      display:flex;
      align-items:center;
      gap:8px
    }

    input[type="file"]{color:var(--muted);font-size:13px}

    button,
    input,
    select,
    textarea{
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    }


    select{
      min-height:var(--tap);
      border-radius:11px;
      border:1px solid rgba(255,255,255,.07);
      background:rgba(255,255,255,.022);
      color:var(--text);
      padding:7px 10px;
      outline:none;
      font-weight:750;
      font-size:16px;

      -webkit-backdrop-filter:blur(22px) saturate(165%);
      backdrop-filter:blur(22px) saturate(165%);

      box-shadow:inset 0 1px 0 rgba(255,255,255,.025);
    }

    .smallInput{
      min-height:var(--tap);
      width:130px;
      border-radius:11px;
      border:1px solid rgba(255,255,255,.07);
      background:rgba(255,255,255,.022);
      color:var(--text);
      padding:7px 10px;
      outline:none;
      font-weight:750;
      font-size:16px;

      -webkit-backdrop-filter:blur(22px) saturate(165%);
      backdrop-filter:blur(22px) saturate(165%);

      box-shadow:inset 0 1px 0 rgba(255,255,255,.025);
    }

    .imdb-loader{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      margin-top:14px;
      padding:12px;

      border:1px solid rgba(255,255,255,.055);
      border-radius:16px;
      background:rgba(255,255,255,.014);

      -webkit-backdrop-filter:blur(30px) saturate(175%);
      backdrop-filter:blur(30px) saturate(175%);

      box-shadow:inset 0 1px 0 rgba(255,255,255,.018);
    }


.series-meta-row{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  flex-basis:100%;
  width:100%;
  padding-bottom:12px;
  margin-bottom:2px;
  border-bottom:1px solid rgba(255,255,255,.075);
}


.imdb-loader input[type="text"]{
  min-height:var(--tap);
  width:180px;
  box-sizing:border-box;
  border-radius:11px;
  border:1px solid rgba(255,255,255,.07);
  background:rgba(255,255,255,.022);
  color:var(--text);
  padding:7px 10px;
  outline:none;
  font:650 16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;

  -webkit-backdrop-filter:blur(22px) saturate(165%);
  backdrop-filter:blur(22px) saturate(165%);

  box-shadow:inset 0 1px 0 rgba(255,255,255,.025);
}

.imdb-loader button:disabled{
  cursor:default;
  opacity:.55;
  transform:none;
}

.imdb-status{
  flex-basis:100%;
  width:100%;
  min-height:18px;
  margin:0;
  color:var(--muted);
  font-size:13px;
  font-weight:650;
  line-height:1.35;
}

.imdb-status[data-error="true"]{
  color:#ff8b8b;
}

    canvas{
      width:100%;
      height:auto;
      border-radius:20px;
      display:block;
      background:#000;
      touch-action:manipulation;

      border:1px solid rgba(255,255,255,.055);
      box-shadow:0 10px 28px rgba(0,0,0,.18);
    }

    .hidden{display:none !important;}

    @media (max-width: 760px){
      .ui{
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        margin: 0;
        border-radius: var(--sheetRadius) var(--sheetRadius) 0 0;
        padding: var(--sheetPad);
        padding-bottom: calc(var(--sheetPad) + env(safe-area-inset-bottom));
        z-index: 9999;
        max-width: none;
        border-left: none;
        border-right: none;
        max-height: 55vh;
        overflow: auto;
        -webkit-overflow-scrolling: touch;
      }

      .wrap{
        padding: 12px;
        padding-bottom: calc(55vh + env(safe-area-inset-bottom) + 12px);
      }

      :root{
        --safe-top: env(safe-area-inset-top);
        --safe-bottom: env(safe-area-inset-bottom);
        --safe-left: env(safe-area-inset-left);
        --safe-right: env(safe-area-inset-right);
      }

      html, body{ height: 100%; }

      .wrap{
        max-width:980px;
        margin:0 auto;
        padding:
          calc(16px + var(--safe-top))
          calc(16px + var(--safe-right))
          calc(16px + var(--safe-bottom))
          calc(16px + var(--safe-left));
      }

      .ui{
        position: sticky;
        top: calc(0px + var(--safe-top));
        z-index: 10;

        border:1px solid rgba(255,255,255,.07);
        background:rgba(255,255,255,.022);
        border-radius:20px;
        padding:12px;
        margin-bottom:12px;
        -webkit-backdrop-filter:blur(36px) saturate(175%);
        backdrop-filter:blur(36px) saturate(175%);
      }

      canvas{
        display:block;
        width:100%;
        height:auto;
        border-radius:18px;
        background:#000;
        margin-bottom: calc(16px + var(--safe-bottom));
      }

      .row{flex-direction: column; align-items: stretch; justify-content:flex-start;}
      .left,.right{width:100%; justify-content:flex-start;}
      .mode-primary-row,.mode-group,.view-options{width:100%;}
      .segmented{flex:1;}
      .segmented button{flex:1;}
      .hint{display:none;}
    }
  
  /* =========================================================
     APPLE-INSPIRED LIQUID GLASS — functional layer only
     Based on Apple's WWDC25 / HIG guidance:
     glass for controls/navigation, calmer materials for content.
  ========================================================= */

  :root{
    --apple-glass-fill: rgba(255,255,255,.055);
    --apple-glass-fill-hover: rgba(255,255,255,.09);
    --apple-glass-stroke: rgba(255,255,255,.12);
    --apple-glass-highlight: rgba(255,255,255,.16);
    --apple-content-fill: rgba(18,20,25,.70);
    --apple-content-stroke: rgba(255,255,255,.065);
    --apple-shadow: 0 10px 34px rgba(0,0,0,.22);
    --apple-radius-lg: 24px;
    --apple-radius-md: 18px;
    --apple-radius-sm: 13px;
  }

  html,body{
    background:
      radial-gradient(900px 500px at 14% -8%, rgba(255,255,255,.085), transparent 62%),
      radial-gradient(720px 460px at 92% 4%, rgba(91,126,185,.10), transparent 66%),
      radial-gradient(560px 360px at 50% 108%, rgba(68,95,132,.055), transparent 70%),
      linear-gradient(180deg,#11151c 0%,#0b0e13 48%,#07090d 100%) !important;
    background-attachment:fixed !important;
  }

  .wrap{
    max-width:980px;
    padding:18px;
  }

  /* Main container is NOT itself glass: it is just layout. */
  .ui{
    overflow:visible;
    isolation:auto;
    padding:0;
    margin-bottom:16px;
    border:0;
    border-radius:0;
    background:transparent;
    -webkit-backdrop-filter:none;
    backdrop-filter:none;
    box-shadow:none;
  }

  .ui::before,
  .ui::after{
    display:none;
  }

  .row{
    gap:12px;
    align-items:flex-start;
  }

  /* Functional Liquid Glass capsules */
  .mode-primary-row,
  .view-options,
  .right{
    position:relative;
    border:1px solid var(--apple-glass-stroke);
    background:
      linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.035)),
      rgba(255,255,255,.018);
    -webkit-backdrop-filter:blur(28px) saturate(165%) brightness(1.05);
    backdrop-filter:blur(28px) saturate(165%) brightness(1.05);
    box-shadow:
      inset 0 1px 0 var(--apple-glass-highlight),
      inset 0 -1px 0 rgba(255,255,255,.02),
      var(--apple-shadow);
  }

  .left{
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:9px;
    flex:1 1 470px;
    min-width:0;
  }

  .mode-primary-row{
    width:auto;
    min-height:50px;
    box-sizing:border-box;
    padding:6px;
    border-radius:19px;
  }

  .mode-primary-row::before,
  .view-options::before,
  .right::before{
    content:"";
    position:absolute;
    inset:1px;
    pointer-events:none;
    border-radius:inherit;
    background:
      linear-gradient(180deg, rgba(255,255,255,.055), transparent 34%);
    opacity:.8;
  }

  .mode-group,
  .mode-primary-row > #exportBtn,
  .view-options > *,
  .right > *{
    position:relative;
    z-index:1;
  }

  .mode-group{
    gap:7px;
    flex-wrap:nowrap;
  }

  .mode-label{
    padding-left:8px;
    color:rgba(255,255,255,.70);
    font-size:12px;
    letter-spacing:.01em;
  }

  .segmented{
    gap:2px;
    padding:2px;
    border:0;
    border-radius:14px;
    background:rgba(0,0,0,.14);
    -webkit-backdrop-filter:none;
    backdrop-filter:none;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.035);
  }

  .segmented button{
    min-height:36px;
    padding:6px 15px;
    border:0;
    border-radius:12px;
    background:transparent;
    box-shadow:none;
    color:rgba(255,255,255,.62);
    font-size:14px;
    font-weight:650;
  }

  .segmented button:hover{
    background:rgba(255,255,255,.045);
    border-color:transparent;
  }

  .segmented button.active{
    color:#fff;
    background:
      linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.10));
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.17),
      0 2px 8px rgba(0,0,0,.18);
  }

  #exportBtn{
    margin-left:2px;
    min-height:38px;
    padding-inline:14px;
    border-radius:13px;
    border:1px solid rgba(255,255,255,.095);
    background:rgba(255,255,255,.065);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10);
  }

  #exportBtn:hover{
    background:rgba(255,255,255,.105);
  }

  .view-options{
    width:auto;
    min-height:48px;
    box-sizing:border-box;
    margin-top:0;
    padding:6px 10px;
    border-radius:17px;
    gap:14px;
  }

  .right{
    flex:1 1 360px;
    min-width:300px;
    padding:8px 10px;
    border-radius:19px;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:10px;
    align-content:flex-start;
  }

  label{
    color:rgba(255,255,255,.64);
    font-size:12px;
    font-weight:650;
  }

  /* Glass controls: restrained, almost clear until hovered. */
  button:not(.toggle):not(.segmented button),
  select,
  .smallInput,
  .imdb-loader input[type="text"]{
    border:1px solid rgba(255,255,255,.085);
    background:rgba(255,255,255,.045);
    color:rgba(255,255,255,.92);
    border-radius:12px;
    -webkit-backdrop-filter:blur(18px) saturate(145%);
    backdrop-filter:blur(18px) saturate(145%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.07),
      0 1px 5px rgba(0,0,0,.08);
  }

  button:not(.toggle):not(.segmented button):hover,
  select:hover{
    background:rgba(255,255,255,.075);
    border-color:rgba(255,255,255,.13);
  }

  select,
  .smallInput,
  .imdb-loader input[type="text"]{
    min-height:40px;
  }

  input[type="file"]{
    color:rgba(255,255,255,.66);
  }

  /* Toggle: closer to current Apple switches, compact and pill-shaped. */
  .toggle{
    width:48px;
    height:28px;
    min-height:28px;
    padding:0;
    border:1px solid rgba(255,255,255,.10);
    background:rgba(255,255,255,.10);
    box-shadow:
      inset 0 1px 2px rgba(0,0,0,.16),
      inset 0 1px 0 rgba(255,255,255,.055);
  }

  .thumb{
    width:24px;
    height:24px;
    top:1px;
    left:2px;
    transform:none;
    box-shadow:0 2px 6px rgba(0,0,0,.24);
  }

  .toggle[aria-checked="true"]{
    background:#0A84FF;
    border-color:rgba(66,160,255,.95);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.20),
      0 2px 8px rgba(10,132,255,.18);
  }

  .toggle[aria-checked="true"] .thumb{
    left:21px;
  }

  /* Content/material layer: intentionally NOT Liquid Glass. */
  .imdb-loader,
  .data-section{
    border:1px solid var(--apple-content-stroke);
    background:var(--apple-content-fill);
    -webkit-backdrop-filter:blur(14px) saturate(115%);
    backdrop-filter:blur(14px) saturate(115%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.025),
      0 8px 24px rgba(0,0,0,.13);
  }

  .imdb-loader{
    margin-top:12px;
    padding:12px;
    border-radius:20px;
  }

  .series-meta-row{
    border-bottom:1px solid rgba(255,255,255,.06);
    padding-bottom:11px;
    margin-bottom:1px;
  }

  .data-section{
    margin-top:12px;
    padding:12px;
    border-radius:20px;
  }

  textarea{
    background:rgba(0,0,0,.19);
    border:1px solid rgba(255,255,255,.065);
    border-radius:15px;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.02),
      inset 0 0 18px rgba(0,0,0,.08);
    -webkit-backdrop-filter:none;
    backdrop-filter:none;
  }

  textarea:focus,
  .smallInput:focus,
  .imdb-loader input[type="text"]:focus,
  select:focus{
    border-color:rgba(10,132,255,.48);
    box-shadow:0 0 0 3px rgba(10,132,255,.10);
  }

  .legend{
    gap:13px;
  }

  .leg-item{

function clamp(x,a,b){ return Math.max(a, Math.min(b, x)); }

function mulberry32(a){
  return function(){
    let t = a += 0x6D2B79F5;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function drawTextCentered(text, cx, cy){
  const m = activeCtx.measureText(text);
  const y = cy + (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2;
  activeCtx.textBaseline = "alphabetic";
  activeCtx.fillText(text, px(cx), px(y));
}

function parseCSV(text){
  const lines = text.trim().split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if (!lines.length) return { seasons:[], rows:[] };

  const seasons = lines[0].split(",").map((s,i)=> (s.trim() || `S${i+1}`));
  const rows = [];

  for (let i=1;i<lines.length;i++){
    const parts = lines[i].split(",").map(s=>s.trim());
    rows.push(parts.map(p=>{
      if (!p || p.toUpperCase() === "NA") return null;
      if (p.toUpperCase() === "X") return "X";
      const v = Number(p.replace(",", "."));
      return Number.isFinite(v) ? v : null;
    }));
  }
  return { seasons, rows };
}

function avg(arr){
  const vals = arr.filter(v => typeof v === "number" && !Number.isNaN(v));
  if (!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}

function pickBucket(score, minScore, maxScore){
  if (typeof score !== "number" || Number.isNaN(score)) return missing;
  const s = clamp(score, minScore, maxScore);
  for (const r of ranges){
    if (s >= r.min && s <= r.max) return r;
  }
  return missing;
}

function roundRectPath(x,y,w,h,r){
  const rr = Math.min(r, w/2, h/2);
  activeCtx.beginPath();
  activeCtx.moveTo(x+rr, y);
  activeCtx.arcTo(x+w, y, x+w, y+h, rr);
  activeCtx.arcTo(x+w, y+h, x, y+h, rr);
  activeCtx.arcTo(x, y+h, x, y, rr);
  activeCtx.arcTo(x, y, x+w, y, rr);
  activeCtx.closePath();
}

function drawBackground(W,H){
  activeCtx.save();
  activeCtx.shadowColor = "rgba(0,0,0,0)";
  activeCtx.shadowBlur = 0;
  activeCtx.shadowOffsetX = 0;
  activeCtx.shadowOffsetY = 0;

  activeCtx.fillStyle = "#04060c";
  activeCtx.fillRect(0,0,W,H);

  if (bgImage){
    const s = Math.max(W/bgImage.width, H/bgImage.height);
    const iw = bgImage.width*s, ih = bgImage.height*s;
    const ix = (W-iw)/2, iy = (H-ih)/2;
    activeCtx.globalAlpha = 0.92;
    activeCtx.drawImage(bgImage, ix, iy, iw, ih);
    activeCtx.globalAlpha = 1;
    activeCtx.fillStyle = "rgba(0,0,0,.55)";
    activeCtx.fillRect(0,0,W,H);
  } else {
    const rand = mulberry32(123456 ^ (W*73856093) ^ (H*19349663));
    activeCtx.fillStyle = "rgba(255,255,255,.03)";
    for (let i=0;i<60;i++){
      const x=rand()*W, y=rand()*H, r=2+rand()*8;
      activeCtx.beginPath(); activeCtx.arc(x,y,r,0,Math.PI*2); activeCtx.fill();
    }
    activeCtx.fillStyle = "rgba(0,0,0,.35)";
    activeCtx.fillRect(0,0,W,H);
  }

  activeCtx.restore();
}

function drawGraphBackground(W, H){
  // On conserve exactement ton fond existant
  drawBackground(W, H);

  /*
    Éclaircissement spécifique aux graphiques.
    Cela évite l’aspect presque noir du fond actuel,
    sans modifier Grid mode ou Card mode.
  */
  activeCtx.save();

  activeCtx.fillStyle = "rgba(255,255,255,.065)";
  activeCtx.fillRect(0, 0, W, H);

  activeCtx.restore();
}

/* =========================
   LOGO
========================= */
function getLogoScaledSize(){
  if (!logoImage) return { w: 0, h: 0, s: 1 };
  const iw = logoImage.width;
  const ih = logoImage.height;

  let s = Math.sqrt(LOGO.targetArea / (iw * ih));
  s = Math.min(s, LOGO.maxW / iw, LOGO.maxH / ih);
  s = Math.min(s, LOGO.maxUpscale);

  const w = Math.round(iw * s);
  const h = Math.round(ih * s);
  return { w, h, s };
}

/* mode "stack": logo en haut à droite (pas centré) */
function drawLogoInFooterStacked(W, footerTop){
  if (!logoImage) return null;
  const { w, h } = getLogoScaledSize();
  const x = W - LOGO.padX - w;
  const y = Math.round(footerTop + SERIES_FOOT.stackTopPad + LOGO.yBias);

  activeCtx.save();
  activeCtx.shadowColor = "rgba(0,0,0,0)";
  activeCtx.shadowBlur = 0;
  activeCtx.shadowOffsetX = 0;
  activeCtx.shadowOffsetY = 0;
  activeCtx.globalAlpha = LOGO.opacity;
  activeCtx.drawImage(logoImage, x, y, w, h);
  activeCtx.restore();

  return { x, y, w, h };
}

/* mode normal: logo centré */
function drawLogoInFooterCentered(W, footerTop, footerH){
  if (!logoImage) return null;
  const { w, h } = getLogoScaledSize();

  const x = W - LOGO.padX - w;
  let y = Math.round(footerTop + (footerH - h) / 2 + LOGO.yBias);

  const padY = 8;
  const yMin = footerTop + padY;
  const yMax = footerTop + footerH - h - padY;
  y = clamp(y, yMin, yMax);

  activeCtx.save();
  activeCtx.shadowColor = "rgba(0,0,0,0)";
  activeCtx.shadowBlur = 0;
  activeCtx.shadowOffsetX = 0;
  activeCtx.shadowOffsetY = 0;
  activeCtx.globalAlpha = LOGO.opacity;
  activeCtx.drawImage(logoImage, x, y, w, h);
  activeCtx.restore();

  return { x, y, w, h };
}

/* =========================
   NOTE GLOBALE
========================= */
function parseSeriesScoreInput(){
  const raw = (seriesScoreEl?.value || "").trim();
  if (!raw) return null;
  const v = Number(raw.replace(",", "."));
  if (!Number.isFinite(v)) return null;
  return clamp(v, MIN_SCORE, MAX_SCORE);
}

function parseEpisodesOverride(){
  const raw = (seriesEpisodesOverrideEl?.value || "").trim();
  if (!raw) return null;
  if (raw.toUpperCase() === "X") return "X";
  const n = Number(raw);
  if (!Number.isFinite(n) || n <= 0) return null;
  return Math.floor(n);
}

function computeEpisodesAuto(rows){
  let c = 0;
  for (const r of rows){
    if (!r) continue;
    for (const v of r){
      if (v == null) continue;
      c++;
    }
  }
  return c || null;
}

function formatScore(value){
  if (value === 10) return "10";
  return value.toFixed(1);
}

function drawStarIcon(x, y, size, color){
  const cx = x + size/2;
  const cy = y + size/2;
  const spikes = 5;
  const outer = size * 0.50;
  const inner = size * 0.22;

  let rot = -Math.PI / 2;
  const step = Math.PI / spikes;

  activeCtx.save();
  activeCtx.beginPath();
  activeCtx.moveTo(cx, cy - outer);
  for (let i = 0; i < spikes; i++){
    activeCtx.lineTo(cx + Math.cos(rot) * outer, cy + Math.sin(rot) * outer);
    rot += step;
    activeCtx.lineTo(cx + Math.cos(rot) * inner, cy + Math.sin(rot) * inner);
    rot += step;
  }
  activeCtx.closePath();
  activeCtx.fillStyle = color;
  activeCtx.fill();
  activeCtx.restore();
}

/* mesure pour dimensionner footer correctement */
function measureSeriesScoreBlock(rows){
  const score = parseSeriesScoreInput();
  if (score == null) return null;

  const override = parseEpisodesOverride();
  const autoEp = computeEpisodesAuto(rows);
  const ep = (override != null) ? override : (autoEp != null ? autoEp : "X");

  const mainText = formatScore(Math.round(score * 10) / 10);
  const suffixText = "/10";
  const metaText = ` \u200A(${ep} episodes)`;

  activeCtx.save();

  activeCtx.font = L.fontSeriesScore;
  const mMain = activeCtx.measureText(mainText);
  const mainAscent = mMain.actualBoundingBoxAscent || 18;
  const mainDescent = mMain.actualBoundingBoxDescent || 6;

  activeCtx.font = L.fontSeriesScoreSuffix;
  const mSuffix = activeCtx.measureText(suffixText);
  const suffixAscent = mSuffix.actualBoundingBoxAscent || 11;
  const suffixDescent = mSuffix.actualBoundingBoxDescent || 4;

  activeCtx.font = L.fontSeriesMeta;
  const mMeta = activeCtx.measureText(metaText);
  const metaAscent = mMeta.actualBoundingBoxAscent || 18;
  const metaDescent = mMeta.actualBoundingBoxDescent || 6;

  const ascent = Math.max(mainAscent, suffixAscent, metaAscent);
  const descent = Math.max(mainDescent, suffixDescent, metaDescent);
  const lineH = ascent + descent;

  const starSize = SERIES_FOOT.starSize;
  const gap = SERIES_FOOT.gap;

  const totalW = starSize + gap + mMain.width + mSuffix.width + mMeta.width;
  const totalH = Math.max(starSize, lineH);

  activeCtx.restore();

  return {
    mainText,
    suffixText,
    metaText,
    totalW,
    totalH,
    ascent,
    mMainW: mMain.width,
    mSuffixW: mSuffix.width
  };
}

/* dessine note en footer (X jamais lié au logo) */
function drawSeriesScoreFooter(W, footerTop, footerH, logoRectOrNull, rows){
  const m = measureSeriesScoreBlock(rows);
  if (!m) return;

  const anchorRight = (W - LOGO.padX);

  let topY;
  if (logoRectOrNull){
    topY = logoRectOrNull.y + logoRectOrNull.h + SERIES_FOOT.gapUnderLogo;
  } else {
    topY = footerTop + Math.round((footerH - m.totalH) / 2);
  }

  topY = clamp(topY, footerTop + SERIES_FOOT.padY, footerTop + footerH - m.totalH - SERIES_FOOT.padY);
  const xLeft = clamp(anchorRight - m.totalW, 12, W - 12 - m.totalW);

  const starY = topY + Math.round((m.totalH - SERIES_FOOT.starSize) / 2) - 3;
  const baselineY = topY + m.ascent;

  drawStarIcon(px(xLeft), px(starY), SERIES_FOOT.starSize, "orange");

  activeCtx.save();
  activeCtx.shadowColor = "rgba(0,0,0,0)";
  activeCtx.shadowBlur = 0;
  activeCtx.shadowOffsetX = 0;
  activeCtx.shadowOffsetY = 0;

  const textX = xLeft + SERIES_FOOT.starSize + SERIES_FOOT.gap;

  activeCtx.font = L.fontSeriesScore;
  activeCtx.fillStyle = "rgba(255,255,255,.95)";
  activeCtx.textAlign = "left";
  activeCtx.textBaseline = "alphabetic";
  activeCtx.fillText(m.mainText, px(textX), px(baselineY));

  activeCtx.font = L.fontSeriesScoreSuffix;
  activeCtx.fillStyle = "rgba(255,255,255,.85)";
  activeCtx.fillText(m.suffixText, px(textX + m.mMainW), px(baselineY));

  activeCtx.font = L.fontSeriesMeta;
  activeCtx.fillStyle = "rgba(255,255,255,.55)";
  activeCtx.fillText(m.metaText, px(textX + m.mMainW + m.mSuffixW), px(baselineY));

  activeCtx.restore();
}

function buildLegend(){

  for (const r of ranges){
    const item = document.createElement("div");
    item.className = "leg-item";

/* =========================
   MODE CARTES
========================= */
function computeSeasonAverages(seasons, rows){
  const S = seasons.length;
  const out = [];

  for (let s=0; s<S; s++){
    const colRaw = rows.map(r => (r && s < r.length) ? r[s] : null);
    const nums = colRaw.filter(v => typeof v === "number" && !Number.isNaN(v));
    const hasUnknown = colRaw.some(v => v === "X");
    const a = nums.length ? (nums.reduce((p,c)=>p+c,0) / nums.length) : null;

    out.push({ title: seasons[s] || `S${s+1}`, avg: a, idx: s, hasUnknown });
  }
  return out;
}

function drawCoverImage(img, x, y, w, h, opacity){
  if (!img) return;
  const s = Math.max(w / img.width, h / img.height);
  const iw = img.width * s;
  const ih = img.height * s;
  const ix = x + (w - iw) / 2;
  const iy = y + (h - ih) / 2;

  activeCtx.save();
  activeCtx.globalAlpha = opacity;
  activeCtx.drawImage(img, ix, iy, iw, ih);
  activeCtx.restore();
}

function drawSeasonCard(x, y, w, h, item, minScore, maxScore){
  activeCtx.save();
  activeCtx.shadowColor = "rgba(0,0,0,.55)";
  activeCtx.shadowBlur = 18;
  activeCtx.shadowOffsetY = 10;

  roundRectPath(x, y, w, h, CARD.radius);
  activeCtx.fillStyle = "rgba(255,255,255,.06)";
  activeCtx.fill();
  activeCtx.restore();

  activeCtx.save();
  roundRectPath(x, y, w, h, CARD.radius);
  activeCtx.clip();

  const bg = cardBgImages[item.idx] || null;
  if (bg) drawCoverImage(bg, x, y, w, h, CARD.bgOpacity);

  activeCtx.fillStyle = "rgba(0,0,0,.25)";
  activeCtx.fillRect(x, y, w, h);

  const g = activeCtx.createLinearGradient(x, y, x+w, y);
  g.addColorStop(0, "rgba(0,0,0,.70)");
  g.addColorStop(0.55, "rgba(0,0,0,.35)");
  g.addColorStop(1, "rgba(0,0,0,.55)");
  activeCtx.fillStyle = g;
  activeCtx.fillRect(x, y, w, h);

  activeCtx.restore();

  const tx = x + CARD.innerPadX;
  const ty = y + h/2;

  activeCtx.save();
  activeCtx.shadowColor = "rgba(0,0,0,0)";
  activeCtx.shadowBlur = 0;
  activeCtx.shadowOffsetX = 0;
  activeCtx.shadowOffsetY = 0;

  activeCtx.font = CARD.titleFont;
  activeCtx.fillStyle = "rgba(255,255,255,.95)";
  activeCtx.textAlign = "left";
  drawTextCentered(item.title, tx, ty);

  const bs = CARD.badgeSize;
  const bx = x + w - CARD.innerPadX - bs;
  const by = y + (h - bs)/2;

  const hasAvg = (typeof item.avg === "number" && !Number.isNaN(item.avg));

  if (!hasAvg && !item.hasUnknown){
    activeCtx.restore();
    return;
  }

  roundRectPath(bx, by, bs, bs, CARD.badgeRadius);

  if (!hasAvg && item.hasUnknown){
    activeCtx.fillStyle = unknown.color;
    activeCtx.fill();

    activeCtx.font = CARD.badgeFont;
    activeCtx.fillStyle = unknown.text;
    activeCtx.textAlign = "center";
    drawTextCentered("?", bx + bs/2, by + bs/2 + 1);

    activeCtx.restore();
    return;
  }

  const shown = Math.round(item.avg * 10) / 10;
  const bucket = pickBucket(shown, minScore, maxScore);

  activeCtx.fillStyle = bucket.color;
  activeCtx.fill();

  activeCtx.font = CARD.badgeFont;
  activeCtx.fillStyle = bucket.text;
  activeCtx.textAlign = "center";
  drawTextCentered(formatScore(shown), bx + bs/2, by + bs/2 + 1);

  activeCtx.restore();
}

/* logo dans carte "filler" + retourne rect complet */
function drawLogoCardInline(x, y, w, h){
  if (!logoImage) return null;

  const { w: lw, h: lh } = getLogoScaledSize();

  const padX = Math.min(LOGO.padX, Math.floor(w * 0.22));
  const padY = 8;

  let dx = Math.round(x + w - padX - lw);
  let dy = Math.round(y + (h - lh) / 2 + LOGO.yBias);

  dx = clamp(dx, x + padY, x + w - lw - padY);
  dy = clamp(dy, y + padY, y + h - lh - padY);

  activeCtx.save();
  activeCtx.shadowColor = "rgba(0,0,0,0)";
  activeCtx.shadowBlur = 0;
  activeCtx.shadowOffsetX = 0;
  activeCtx.shadowOffsetY = 0;

  activeCtx.globalAlpha = LOGO.opacity;
  activeCtx.drawImage(logoImage, dx, dy, lw, lh);
  activeCtx.restore();

  return { x: dx, y: dy, w: lw, h: lh, cardX: x, cardY: y, cardW: w, cardH: h, padX };
}

/* note sous logo dans la carte filler, X indépendant du logo */
function drawSeriesScoreUnderInlineLogo(logoRect, rows){
  const m = measureSeriesScoreBlock(rows);
  if (!m || !logoRect) return false;

  const available = (logoRect.cardY + logoRect.cardH) - (logoRect.y + logoRect.h) - SERIES_FOOT.padY;
  const need = SERIES_FOOT.gapUnderLogo + m.totalH;
  if (available < need) return false;

  const anchorRight = (logoRect.cardX + logoRect.cardW - logoRect.padX);
  let topY = logoRect.y + logoRect.h + SERIES_FOOT.gapUnderLogo;
  topY = clamp(topY, logoRect.cardY + SERIES_FOOT.padY, logoRect.cardY + logoRect.cardH - m.totalH - SERIES_FOOT.padY);

  const xLeft = clamp(anchorRight - m.totalW, logoRect.cardX + 12, logoRect.cardX + logoRect.cardW - 12 - m.totalW);

  const starY = topY + Math.round((m.totalH - SERIES_FOOT.starSize) / 2) - 3;
  const baselineY = topY + m.ascent;

  drawStarIcon(px(xLeft), px(starY), SERIES_FOOT.starSize, "orange");

  activeCtx.save();
  activeCtx.shadowColor = "rgba(0,0,0,0)";
  activeCtx.shadowBlur = 0;
  activeCtx.shadowOffsetX = 0;
  activeCtx.shadowOffsetY = 0;

  const textX = xLeft + SERIES_FOOT.starSize + SERIES_FOOT.gap;

  activeCtx.font = L.fontSeriesScore;
  activeCtx.fillStyle = "rgba(255,255,255,.95)";
  activeCtx.textAlign = "left";
  activeCtx.textBaseline = "alphabetic";
  activeCtx.fillText(m.mainText, px(textX), px(baselineY));

  activeCtx.font = L.fontSeriesScoreSuffix;
  activeCtx.fillStyle = "rgba(255,255,255,.85)";
  activeCtx.fillText(m.suffixText, px(textX + m.mMainW), px(baselineY));

  activeCtx.font = L.fontSeriesMeta;
  activeCtx.fillStyle = "rgba(255,255,255,.55)";
  activeCtx.fillText(m.metaText, px(textX + m.mMainW + m.mSuffixW), px(baselineY));

  activeCtx.restore();

  return true;
}

function renderSeasonalMode(seasons, rows, minScore, maxScore){
  activeCanvas.width = 900;
  const W = activeCanvas.width;

  const cols = (W >= CARD.colsMinW) ? 2 : 1;
  const pad = CARD.pad;
  const gap = CARD.gap;

  const cardW = (cols === 2)
    ? Math.floor((W - pad*2 - gap) / 2)
    : (W - pad*2);

  const cardH = CARD.cardH;

  let items = computeSeasonAverages(seasons, rows);

  const hasSeriesScore = (parseSeriesScoreInput() != null);
  const useInlineLogoFiller = (cols === 2) && (items.length % 2 === 1) && !!logoImage;
  if (useInlineLogoFiller){
    items = [...items, { type: "logo" }];
  }

  const useFooterLogo = !!logoImage && !useInlineLogoFiller;

  const rowsCount = Math.ceil(items.length / cols);
  const cardsBlockH = (rowsCount * cardH) + (Math.max(0, rowsCount - 1) * gap);

  let needFooter = useFooterLogo || hasSeriesScore;

  let footerH = 0;
  if (needFooter){
    const m = hasSeriesScore ? measureSeriesScoreBlock(rows) : null;
    const { h: logoH } = getLogoScaledSize();

    if (useFooterLogo && hasSeriesScore && m){
      footerH = Math.max(
        FOOTER.minH,
        SERIES_FOOT.stackTopPad + logoH + SERIES_FOOT.gapUnderLogo + m.totalH + SERIES_FOOT.padY
      );
    } else if (useFooterLogo){
      footerH = Math.max(FOOTER.minH, logoH + SERIES_FOOT.padY*2);
    } else if (hasSeriesScore && m){
      footerH = Math.max(FOOTER.minH, m.totalH + SERIES_FOOT.padY*2);
    } else {
      footerH = FOOTER.minH;
    }
  }

  const footerGap = needFooter ? 6 : 0;
  const Hneeded = pad + cardsBlockH + footerGap + footerH + pad;
  activeCanvas.height = Math.max(Math.ceil(Hneeded), 420);

  const H = activeCanvas.height;
  activeCtx.clearRect(0,0,W,H);
  drawBackground(W,H);

  let fillerHadNote = false;

  for (let i=0; i<items.length; i++){
    const r = Math.floor(i / cols);
    const c = i % cols;
    const x = pad + c * (cardW + gap);
    const y = pad + r * (cardH + gap);

    const item = items[i];

    if (item && item.type === "logo"){
      const lr = drawLogoCardInline(x, y, cardW, cardH);
      if (hasSeriesScore){
        fillerHadNote = drawSeriesScoreUnderInlineLogo(lr, rows);
        if (!fillerHadNote){
          needFooter = true;
        }
      }
      continue;
    }

    drawSeasonCard(x, y, cardW, cardH, item, minScore, maxScore);
  }

  if (needFooter){
    const footerTop = pad + cardsBlockH + footerGap;

    const hasScore = (parseSeriesScoreInput() != null);
    const stack = !!logoImage && hasScore && useFooterLogo;

    const logoRect = stack
      ? drawLogoInFooterStacked(W, footerTop)
      : (useFooterLogo ? drawLogoInFooterCentered(W, footerTop, footerH) : null);

    if (!(useInlineLogoFiller && fillerHadNote)){
      drawSeriesScoreFooter(W, footerTop, footerH, logoRect, rows);
    }
  }
}

function renderGridMode(seasons, rows, minScore, maxScore){
  const S = seasons.length;
  const E = rows.length;

  const gridWidthNeeded =
    L.leftLabelW +
    (S * L.cellW) +
    (Math.max(0, S - 1) * L.gapX) +
    L.pad * 2;

  activeCanvas.width = Math.max(900, gridWidthNeeded);

  const gridH = (E * L.cellH) + (Math.max(0, E - 1) * L.gapY);
  const t = clamp((E - FLEX.fewEp) / 10, 0, 1);
  const topExtra = Math.round(FLEX.topMin + (FLEX.topMax - FLEX.topMin) * t);

  const gridTop = L.pad + topExtra;
  const gridX0 = L.pad + L.leftLabelW;
  const gridY0 = gridTop + L.topLabelH;

  const avgY = gridY0 + gridH + AVG.gapFromGrid;

  const hasSeriesScore = (parseSeriesScoreInput() != null);
  const needFooter = !!logoImage || hasSeriesScore;

  const m = hasSeriesScore ? measureSeriesScoreBlock(rows) : null;
  const { h: logoH } = getLogoScaledSize();

  let footerH = FOOTER.minH;
  if (needFooter){
    if (logoImage && hasSeriesScore && m){
      footerH = Math.max(
        FOOTER.minH,
        SERIES_FOOT.stackTopPad + logoH + SERIES_FOOT.gapUnderLogo + m.totalH + SERIES_FOOT.padY
      );
    } else if (logoImage){
      footerH = Math.max(FOOTER.minH, logoH + SERIES_FOOT.padY*2);
    } else if (hasSeriesScore && m){
      footerH = Math.max(FOOTER.minH, m.totalH + SERIES_FOOT.padY*2);
    }
  }

  const footerTop = avgY + AVG.blockH + FOOTER.gapFromAvg;
  const Hneeded = footerTop + footerH + L.pad;
  activeCanvas.height = Math.max(Math.ceil(Hneeded), 420);

  const W = activeCanvas.width;
  const H = activeCanvas.height;

  activeCtx.clearRect(0,0,W,H);
  drawBackground(W,H);

  activeCtx.save();
  activeCtx.shadowColor = "rgba(0,0,0,0)";
  activeCtx.shadowBlur = 0;
  activeCtx.shadowOffsetX = 0;
  activeCtx.shadowOffsetY = 0;

  activeCtx.font = L.fontAxis;
  activeCtx.fillStyle = "#ffffff";
  activeCtx.textAlign = "center";

  for (let s = 0; s < S; s++){
    const x = gridX0 + s * (L.cellW + L.gapX) + L.cellW / 2;
    const y = gridTop + L.topLabelH / 2;
    drawTextCentered(seasons[s] || ("S" + (s+1)), x, y);
  }

  activeCtx.textAlign = "left";
  for (let e = 0; e < E; e++){
    const x = L.pad;
    const y = gridY0 + e * (L.cellH + L.gapY) + L.cellH / 2;
    drawTextCentered("E" + (e+1), x, y);
  }

  activeCtx.restore();

  for (let e = 0; e < E; e++){
    for (let s = 0; s < S; s++){
      const raw = (rows[e] && s < rows[e].length) ? rows[e][s] : null;
      if (raw == null) continue;

      const isUnknown = (raw === "X");
      const bucket = isUnknown ? unknown : pickBucket(raw, minScore, maxScore);

      const x = gridX0 + s * (L.cellW + L.gapX);
      const y = gridY0 + e * (L.cellH + L.gapY);

      activeCtx.fillStyle = bucket.color;
      roundRectPath(x, y, L.cellW, L.cellH, L.r);
      activeCtx.fill();

      activeCtx.font = L.fontCell;
      activeCtx.fillStyle = bucket.text;
      activeCtx.textAlign = "center";

      const txt = isUnknown ? "?" : formatScore(Number(raw));
      drawTextCentered(txt, x + L.cellW/2, y + L.cellH/2 + 2);
    }
  }

  activeCtx.font = L.fontAvgLabel;
  activeCtx.fillStyle = "#ffffff";
  activeCtx.textAlign = "left";
  drawTextCentered("AVG.", L.pad, avgY);

  for (let s = 0; s < S; s++){
    const col = rows
      .map(r => (r && s < r.length) ? r[s] : null)
      .filter(v => v !== "X");

    const a = avg(col);
    const x = gridX0 + s * (L.cellW + L.gapX);

    if (a != null) {
      const shown = Number(a.toFixed(1));
      activeCtx.font = L.fontAvg;
      activeCtx.fillStyle = "#ffffff";
      activeCtx.textAlign = "center";
      drawTextCentered(formatScore(shown), x + L.cellW/2, avgY - 6);

      const b = pickBucket(shown, minScore, maxScore);
      const barY = avgY + AVG.barOffset;
      activeCtx.fillStyle = b.color;
      roundRectPath(x, barY, L.cellW, AVG.barH, 999);
      activeCtx.fill();
    }
  }

  const stack = !!logoImage && hasSeriesScore;
  const logoRect = stack
    ? drawLogoInFooterStacked(W, footerTop)
    : (logoImage ? drawLogoInFooterCentered(W, footerTop, footerH) : null);

  drawSeriesScoreFooter(W, footerTop, footerH, logoRect, rows);
}

function renderGridInvertedMode(seasons, rows, minScore, maxScore){
  const S = seasons.length;
  const E = rows.length;

  /*
    Inverted layout:
    - episodes become columns;
    - seasons become rows;
    - the canvas grows horizontally with episode count;
    - season averages are displayed at the right.
  */
  const avgRightGap = 42;
  const avgLabelW = 92;
  const avgBarW = 7;
  const rightReserve = avgRightGap + avgLabelW + avgBarW + 26;

  const gridW =
    (E * L.cellW) +
    (Math.max(0, E - 1) * L.gapX);

  const gridWidthNeeded =
    L.pad +
    L.leftLabelW +
    gridW +
    rightReserve +
    L.pad;

  activeCanvas.width = Math.max(900, Math.ceil(gridWidthNeeded));

  const gridH =
    (S * L.cellH) +
    (Math.max(0, S - 1) * L.gapY);

  /*
    In inverted mode the number of seasons controls vertical size,
    while episode count controls horizontal size.
  */
  const t = clamp((S - 5) / 8, 0, 1);
  const topExtra = Math.round(
    FLEX.topMin +
    (FLEX.topMax - FLEX.topMin) * t
  );

  const gridTop = L.pad + topExtra;
  const gridX0 = L.pad + L.leftLabelW;
  const gridY0 = gridTop + L.topLabelH;

  const avgX =
    gridX0 +
    gridW +
    avgRightGap;

  const hasSeriesScore =
    parseSeriesScoreInput() != null;

  const needFooter =
    !!logoImage ||
    hasSeriesScore;

  const m =
    hasSeriesScore
      ? measureSeriesScoreBlock(rows)
      : null;

  const { h: logoH } =
    getLogoScaledSize();

  let footerH = FOOTER.minH;

  if (needFooter){
    if (logoImage && hasSeriesScore && m){
      footerH = Math.max(
        FOOTER.minH,
        SERIES_FOOT.stackTopPad +
        logoH +
        SERIES_FOOT.gapUnderLogo +
        m.totalH +
        SERIES_FOOT.padY
      );
    } else if (logoImage){
      footerH = Math.max(
        FOOTER.minH,
        logoH + SERIES_FOOT.padY * 2
      );
    } else if (hasSeriesScore && m){
      footerH = Math.max(
        FOOTER.minH,
        m.totalH + SERIES_FOOT.padY * 2
      );
    }
  }

  const footerTop =
    gridY0 +
    gridH +
    FOOTER.gapFromAvg +
    14;

  const Hneeded =
    footerTop +
    footerH +
    L.pad;

  activeCanvas.height =
    Math.max(
      Math.ceil(Hneeded),
      420
    );

  const W = activeCanvas.width;
  const H = activeCanvas.height;

  activeCtx.clearRect(0, 0, W, H);
  drawBackground(W, H);

  /* =========================
     AXIS LABELS
  ========================= */

  activeCtx.save();

  activeCtx.shadowColor = "rgba(0,0,0,0)";
  activeCtx.shadowBlur = 0;
  activeCtx.shadowOffsetX = 0;
  activeCtx.shadowOffsetY = 0;

  activeCtx.font = L.fontAxis;
  activeCtx.fillStyle = "#ffffff";

  /* Episodes along the top */
  activeCtx.textAlign = "center";

  for (let e = 0; e < E; e++){
    const x =
      gridX0 +
      e * (L.cellW + L.gapX) +
      L.cellW / 2;

    const y =
      gridTop +
      L.topLabelH / 2;

    drawTextCentered(
      "E" + (e + 1),
      x,
      y
    );
  }

  /* Seasons down the left */
  activeCtx.textAlign = "left";

  for (let s = 0; s < S; s++){
    const x = L.pad;

    const y =
      gridY0 +
      s * (L.cellH + L.gapY) +
      L.cellH / 2;

    drawTextCentered(
      seasons[s] || ("S" + (s + 1)),
      x,
      y
    );
  }

  /* AVG. header at the right */
  activeCtx.font = L.fontAvgLabel;
  activeCtx.fillStyle = "rgba(255,255,255,.82)";
  activeCtx.textAlign = "left";

  drawTextCentered(
    "AVG.",
    avgX,
    gridTop + L.topLabelH / 2
  );

  activeCtx.restore();

  /* =========================
     CELLS
  ========================= */

  for (let s = 0; s < S; s++){
    for (let e = 0; e < E; e++){
      const raw =
        (rows[e] && s < rows[e].length)
          ? rows[e][s]
          : null;

      if (raw == null) continue;

      const isUnknown =
        raw === "X";

      const bucket =
        isUnknown
          ? unknown
          : pickBucket(
              raw,
              minScore,
              maxScore
            );

      const x =
        gridX0 +
        e * (L.cellW + L.gapX);

      const y =
        gridY0 +
        s * (L.cellH + L.gapY);

      activeCtx.fillStyle =
        bucket.color;

      roundRectPath(
        x,
        y,
        L.cellW,
        L.cellH,
        L.r
      );

      activeCtx.fill();

      activeCtx.font =
        L.fontCell;

      activeCtx.fillStyle =
        bucket.text;

      activeCtx.textAlign =
        "center";

      const txt =
        isUnknown
          ? "?"
          : formatScore(Number(raw));

      drawTextCentered(
        txt,
        x + L.cellW / 2,
        y + L.cellH / 2 + 2
      );
    }
  }

  /* =========================
     SEASON AVERAGES ON RIGHT
  ========================= */

  for (let s = 0; s < S; s++){
    const col =
      rows
        .map(
          r =>
            (r && s < r.length)
              ? r[s]
              : null
        )
        .filter(v => v !== "X");

    const a = avg(col);

    if (a == null) continue;

    const shown =
      Number(a.toFixed(1));

    const rowCenterY =
      gridY0 +
      s * (L.cellH + L.gapY) +
      L.cellH / 2;

    activeCtx.font =
      L.fontAvg;

    activeCtx.fillStyle =
      "#ffffff";

    activeCtx.textAlign =
      "left";

    drawTextCentered(
      formatScore(shown),
      avgX,
      rowCenterY
    );

    const bucket =
      pickBucket(
        shown,
        minScore,
        maxScore
      );

    /*
      Vertical equivalent of the horizontal average bar
      used in the default grid.
    */
    const barX =
      avgX +
      52;

    const barH =
      Math.max(
        18,
        L.cellH - 10
      );

    const barY =
      rowCenterY -
      barH / 2;

    activeCtx.fillStyle =
      bucket.color;

    roundRectPath(
      barX,
      barY,
      avgBarW,
      barH,
      999
    );

    activeCtx.fill();
  }

  /* =========================
     SAME FOOTER / LOGO LOGIC
     AS DEFAULT GRID
  ========================= */

  const stack =
    !!logoImage &&
    hasSeriesScore;

  const logoRect =
    stack
      ? drawLogoInFooterStacked(
          W,
          footerTop
        )
      : (
          logoImage
            ? drawLogoInFooterCentered(
                W,
                footerTop,
                footerH
              )
            : null
        );

  drawSeriesScoreFooter(
    W,
    footerTop,
    footerH,
    logoRect,
    rows
  );
}

function renderGridWrappedMode(seasons, rows, minScore, maxScore){
  activeCanvas.width = WRAPPED.canvasW;
  const W = activeCanvas.width;

  const cols = WRAPPED.cols;

  const sections = [];

  for (let s = 0; s < seasons.length; s++){
    const episodes = [];

    for (let e = 0; e < rows.length; e++){
      const raw =
        (rows[e] && s < rows[e].length)
          ? rows[e][s]
          : null;

      if (raw == null) continue;

      episodes.push({
        episodeIndex: e,
        raw,
        value:
          raw === "X"
            ? null
            : Number(raw)
      });
    }

    const numericValues =
      episodes
        .map(ep => ep.value)
        .filter(
          v =>
            typeof v === "number" &&
            Number.isFinite(v)
        );

    const seasonAvg =
      numericValues.length
        ? numericValues.reduce((a, b) => a + b, 0) /
          numericValues.length
        : null;

    const rowCount =
      Math.max(
        1,
        Math.ceil(episodes.length / cols)
      );

    const cardsH =
      rowCount * WRAPPED.cellH +
      Math.max(0, rowCount - 1) * WRAPPED.gapY;

    const blockH =
      WRAPPED.titleH +
      WRAPPED.titleToCards +
      cardsH;

    sections.push({
      seasonIndex: s,
      episodes,
      avg: seasonAvg,
      rowCount,
      cardsH,
      blockH
    });
  }

  const hasSeriesScore =
    parseSeriesScoreInput() != null;

  const needFooter =
    !!logoImage ||
    hasSeriesScore;

  const scoreMetrics =
    hasSeriesScore
      ? measureSeriesScoreBlock(rows)
      : null;

  const { h: logoH } =
    getLogoScaledSize();

  let footerH = 0;

  if (needFooter){
    if (logoImage && hasSeriesScore && scoreMetrics){
      footerH = Math.max(
        FOOTER.minH,
        SERIES_FOOT.stackTopPad +
        logoH +
        SERIES_FOOT.gapUnderLogo +
        scoreMetrics.totalH +
        SERIES_FOOT.padY
      );
    } else if (logoImage){
      footerH = Math.max(
        FOOTER.minH,
        logoH + SERIES_FOOT.padY * 2
      );
    } else if (hasSeriesScore && scoreMetrics){
      footerH = Math.max(
        FOOTER.minH,
        scoreMetrics.totalH +
        SERIES_FOOT.padY * 2
      );
    }
  }

  const sectionsH =
    sections.reduce(
      (sum, section) =>
        sum + section.blockH,
      0
    ) +
    Math.max(
      0,
      sections.length - 1
    ) * WRAPPED.sectionGap;

  const footerTop =
    WRAPPED.padTop +
    sectionsH +
    (needFooter ? WRAPPED.footerGap : 0);

  const Hneeded =
    footerTop +
    footerH +
    L.pad;

  activeCanvas.height =
    Math.max(
      Math.ceil(Hneeded),
      420
    );

  const H = activeCanvas.height;

  activeCtx.clearRect(0, 0, W, H);
  drawBackground(W, H);

  let cursorY =
    WRAPPED.padTop;

  for (const section of sections){
    const s =
      section.seasonIndex;

    /* Season title */
    const title =
      `Season ${s + 1}`;

    activeCtx.save();

    activeCtx.shadowColor =
      "rgba(0,0,0,.88)";
    activeCtx.shadowBlur = 7;
    activeCtx.shadowOffsetY = 1;

    activeCtx.font =
      WRAPPED.seasonFont;

    activeCtx.textAlign =
      "left";

    activeCtx.textBaseline =
      "alphabetic";

    activeCtx.fillStyle =
      "rgba(255,255,255,.97)";

    const titleBaseline =
      cursorY + 30;

    activeCtx.fillText(
      title,
      WRAPPED.padX,
      titleBaseline
    );

    const titleWidth =
      activeCtx.measureText(title).width;

    if (
      typeof section.avg === "number" &&
      Number.isFinite(section.avg)
    ){
      const shownAvg =
        Math.round(section.avg * 10) / 10;

      activeCtx.font =
        WRAPPED.avgFont;

      activeCtx.fillStyle =
        "rgba(255,255,255,.72)";

      activeCtx.shadowColor =
        "rgba(0,0,0,.94)";
      activeCtx.shadowBlur = 6;

      activeCtx.fillText(
        ` (avg ${formatScore(shownAvg)})`,
        WRAPPED.padX + titleWidth + 3,
        titleBaseline
      );
    }

    activeCtx.restore();

    /* Episode cards */
    const cardsY =
      cursorY +
      WRAPPED.titleH +
      WRAPPED.titleToCards;

    section.episodes.forEach(
      (episode, index) => {
        const row =
          Math.floor(index / cols);

        const col =
          index % cols;

        const x =
          WRAPPED.padX +
          col *
            (WRAPPED.cellW + WRAPPED.gapX);

        const y =
          cardsY +
          row *
            (WRAPPED.cellH + WRAPPED.gapY);

        const isUnknown =
          episode.raw === "X";

        const bucket =
          isUnknown
            ? unknown
            : pickBucket(
                episode.value,
                minScore,
                maxScore
              );

        activeCtx.fillStyle =
          bucket.color;

        roundRectPath(
          x,
          y,
          WRAPPED.cellW,
          WRAPPED.cellH,
          WRAPPED.radius
        );

        activeCtx.fill();

        const textColor =
          isUnknown
            ? unknown.text
            : bucket.text;

        const whiteLike =
          String(textColor).toLowerCase().includes("255,255,255") ||
          String(textColor).toLowerCase() === "#ffffff";

        activeCtx.save();

        if (whiteLike){
          activeCtx.shadowColor =
            "rgba(0,0,0,.38)";
          activeCtx.shadowBlur = 2;
          activeCtx.shadowOffsetY = 1;
        }

        activeCtx.fillStyle =
          textColor;

        activeCtx.font =
          WRAPPED.epFont;

        activeCtx.textAlign =
          "left";

        activeCtx.textBaseline =
          "alphabetic";

        activeCtx.globalAlpha =
          0.76;

        activeCtx.fillText(
          `E${episode.episodeIndex + 1}`,
          x + 8,
          y + 25
        );

        activeCtx.globalAlpha = 1;

        activeCtx.font =
          WRAPPED.scoreFont;

        activeCtx.textAlign =
          "right";

        activeCtx.textBaseline =
          "alphabetic";

        const scoreText =
          isUnknown
            ? "?"
            : formatScore(
                Number(episode.value)
              );

        activeCtx.fillText(
          scoreText,
          x + WRAPPED.cellW - 10,
          y + WRAPPED.cellH - 10
        );

        activeCtx.restore();
      }
    );

    cursorY +=
      section.blockH +
      WRAPPED.sectionGap;
  }

  /*
    Same logo + global score footer logic as the normal Grid.
  */
  if (needFooter){
    const stack =
      !!logoImage &&
      hasSeriesScore;

    const logoRect =
      stack
        ? drawLogoInFooterStacked(
            W,
            footerTop
          )
        : (
            logoImage
              ? drawLogoInFooterCentered(
                  W,
                  footerTop,
                  footerH
                )
              : null
          );

    drawSeriesScoreFooter(
      W,
      footerTop,
      footerH,
      logoRect,
      rows
    );
  }
}



/* =========================
   GRAPH MODE
========================= */
function graphNumericValue(raw){
  if (typeof raw === "number" && Number.isFinite(raw)){
    return clamp(raw, MIN_SCORE, MAX_SCORE);
  }
  return null;
}

function buildEpisodeTimeline(seasons, rows){
  const points = [];
  const spans = [];

  for (let s = 0; s < seasons.length; s++){
    const start = points.length;

    for (let e = 0; e < rows.length; e++){
      const raw =
        rows[e] && s < rows[e].length
          ? rows[e][s]
          : null;

      // null / NA = aucun épisode à cet emplacement.
      if (raw == null) continue;

      points.push({
        seasonIndex: s,
        episodeIndex: e,
        season: seasons[s] || `S${s + 1}`,
        episode: e + 1,
        raw,
        value: graphNumericValue(raw)
      });
    }

    const end = points.length - 1;

    if (end >= start){
      spans.push({
        seasonIndex: s,
        season: seasons[s] || `S${s + 1}`,
        start,
        end
      });
    }
  }

  return { points, spans };
}

function computeGraphYDomain(values){
  const nums = values.filter(
    v => typeof v === "number" && Number.isFinite(v)
  );

  if (!nums.length){
    return { min: 6, max: 10, step: 1 };
  }

  const lowest = Math.min(...nums);

  /*
    Le graphe de référence garde généralement une fenêtre
    assez lisible autour des notes réellement utilisées.
    On descend sous 6 uniquement si les données l’exigent.
  */
  let min = Math.min(Math.floor(lowest), 6);
  min = clamp(min, MIN_SCORE, 9);

  const max = 10;
  const span = max - min;
  const step = span > 6 ? 2 : 1;

  return { min, max, step };
}

function makeGraphScales(count, yDomain){
  const plotW = GRAPH.W - GRAPH.left - GRAPH.right;
  const plotH = GRAPH.H - GRAPH.top - GRAPH.bottom;

  const x = index => {
    if (count <= 1){
      return GRAPH.left + plotW / 2;
    }
    return GRAPH.left + (index / (count - 1)) * plotW;
  };

  const y = value => {
    const t =
      (value - yDomain.min) /
      (yDomain.max - yDomain.min || 1);

    return GRAPH.top + (1 - t) * plotH;
  };

  return { x, y, plotW, plotH };
}

function drawGraphBase(yDomain){
  const plotRight = GRAPH.W - GRAPH.right;
  const plotBottom = GRAPH.H - GRAPH.bottom;

  activeCtx.save();

  activeCtx.font =
    "600 11px -apple-system,system-ui,Segoe UI,Roboto,Arial";

  activeCtx.textAlign = "right";
  activeCtx.textBaseline = "middle";

  for (
    let value = Math.ceil(yDomain.min);
    value <= yDomain.max;
    value += yDomain.step
  ){
    const t =
      (value - yDomain.min) /
      (yDomain.max - yDomain.min || 1);

    const yy =
      GRAPH.top +
      (1 - t) *
        (GRAPH.H - GRAPH.top - GRAPH.bottom);

    activeCtx.beginPath();
    activeCtx.moveTo(GRAPH.left, yy);
    activeCtx.lineTo(plotRight, yy);
    activeCtx.strokeStyle = GRAPH.gridColor;
    activeCtx.lineWidth = 1;
    activeCtx.setLineDash([4, 4]);
    activeCtx.stroke();

    activeCtx.setLineDash([]);
    activeCtx.fillStyle = GRAPH.labelColor;
    activeCtx.fillText(
      String(value),
      GRAPH.left - 8,
      yy
    );
  }

  activeCtx.beginPath();
  activeCtx.moveTo(GRAPH.left, GRAPH.top);
  activeCtx.lineTo(GRAPH.left, plotBottom);
  activeCtx.lineTo(plotRight, plotBottom);

  activeCtx.strokeStyle = GRAPH.axisColor;
  activeCtx.lineWidth = 1;
  activeCtx.stroke();

  activeCtx.restore();
}

function drawSeasonBandsAndLabels(spans, xScale, pointCount){
  if (!spans.length || !pointCount) return;

  const plotBottom = GRAPH.H - GRAPH.bottom;
  const plotH = plotBottom - GRAPH.top;

  activeCtx.save();

  spans.forEach((span, idx) => {
    const firstX = xScale(span.start);
    const lastX = xScale(span.end);

    let left =
      span.start === 0
        ? GRAPH.left
        : (xScale(span.start - 1) + firstX) / 2;

    let right =
      span.end === pointCount - 1
        ? GRAPH.W - GRAPH.right
        : (lastX + xScale(span.end + 1)) / 2;

    if (idx % 2 === 1){
      activeCtx.fillStyle = GRAPH.seasonBand;
      activeCtx.fillRect(
        left,
        GRAPH.top,
        Math.max(0, right - left),
        plotH
      );
    }

    const center = (left + right) / 2;

    activeCtx.font =
      "600 11px -apple-system,system-ui,Segoe UI,Roboto,Arial";
    activeCtx.textAlign = "center";
    activeCtx.textBaseline = "top";
    activeCtx.fillStyle = GRAPH.labelColor;

    activeCtx.fillText(
      span.season,
      center,
      plotBottom + 9
    );
  });

  activeCtx.restore();
}

function splitNumericSegments(points){
  const segments = [];
  let current = [];

  for (const point of points){
    if (
      point &&
      typeof point.y === "number" &&
      Number.isFinite(point.y)
    ){
      current.push(point);
    } else {
      if (current.length){
        segments.push(current);
        current = [];
      }
    }
  }

  if (current.length){
    segments.push(current);
  }

  return segments;
}

function drawSmoothPath(points, strokeStyle, lineWidth, opacity = 1){
  if (!points || points.length < 2) return;

  activeCtx.save();
  activeCtx.strokeStyle = strokeStyle;
  activeCtx.lineWidth = lineWidth;
  activeCtx.globalAlpha = opacity;
  activeCtx.lineCap = "round";
  activeCtx.lineJoin = "round";

  activeCtx.beginPath();
  activeCtx.moveTo(points[0].x, points[0].y);

  if (points.length === 2){
    activeCtx.lineTo(points[1].x, points[1].y);
  } else {
    /*
      Catmull-Rom -> Bézier cubique.
      Cela reproduit le comportement visuel du SVG de référence
      sans dépendance externe comme D3.
    */
    for (let i = 0; i < points.length - 1; i++){
      const p0 = points[i - 1] || points[i];
      const p1 = points[i];
      const p2 = points[i + 1];
      const p3 = points[i + 2] || p2;

      const cp1x = p1.x + (p2.x - p0.x) / 6;
      const cp1y = p1.y + (p2.y - p0.y) / 6;

      const cp2x = p2.x - (p3.x - p1.x) / 6;
      const cp2y = p2.y - (p3.y - p1.y) / 6;

      activeCtx.bezierCurveTo(
        cp1x,
        cp1y,
        cp2x,
        cp2y,
        p2.x,
        p2.y
      );
    }
  }

  activeCtx.stroke();
  activeCtx.restore();
}

function gaussianTrend(values, radius = 3, sigma = 1.65){
  /*
    L’algorithme exact du site source n’est pas disponible dans
    le HTML rendu. Cette version utilise un lissage gaussien
    centré, adapté aux séries de notes épisodiques.

    - les épisodes X sont ignorés dans le calcul ;
    - leur position temporelle reste conservée ;
    - le résultat est nettement plus stable qu’une simple
      moyenne mobile rectangulaire.
  */
  const out = new Array(values.length).fill(null);

  for (let i = 0; i < values.length; i++){
    let weighted = 0;
    let totalWeight = 0;

    for (
      let j = Math.max(0, i - radius);
      j <= Math.min(values.length - 1, i + radius);
      j++
    ){
      const v = values[j];

      if (
        typeof v !== "number" ||
        !Number.isFinite(v)
      ){
        continue;
      }

      const d = j - i;
      const w =
        Math.exp(
          -(d * d) /
          (2 * sigma * sigma)
        );

      weighted += v * w;
      totalWeight += w;
    }

    if (totalWeight > 0){
      out[i] = weighted / totalWeight;
    }
  }

  return out;
}

function drawEpisodeDots(points, scales){
  activeCtx.save();

  for (let i = 0; i < points.length; i++){
    const point = points[i];

    if (
      typeof point.value !== "number" ||
      !Number.isFinite(point.value)
    ){
      continue;
    }

    const x = scales.x(i);
    const y = scales.y(point.value);
    const bucket = pickBucket(
      point.value,
      MIN_SCORE,
      MAX_SCORE
    );

    activeCtx.beginPath();
    activeCtx.arc(
      x,
      y,
      GRAPH.dotR,
      0,
      Math.PI * 2
    );

    activeCtx.fillStyle = bucket.color;
    activeCtx.fill();

    activeCtx.strokeStyle = "rgba(0,0,0,.75)";
    activeCtx.lineWidth = 1.5;
    activeCtx.stroke();
  }

  activeCtx.restore();
}

function renderEpisodicGraph(seasons, rows){
  activeCanvas.width = GRAPH.W;

  const graphHasFooter =
    !!logoImage ||
    parseSeriesScoreInput() != null;

  let graphFooterH = 0;

  if (graphHasFooter){
    const scoreMetrics =
      measureSeriesScoreBlock(rows);

    const { h: logoH } =
      getLogoScaledSize();

    if (logoImage && scoreMetrics){
      graphFooterH = Math.max(
        GRAPH_FOOTER.minH,
        SERIES_FOOT.stackTopPad +
        logoH +
        SERIES_FOOT.gapUnderLogo +
        scoreMetrics.totalH +
        SERIES_FOOT.padY
      );

    } else if (logoImage){
      graphFooterH = Math.max(
        GRAPH_FOOTER.minH,
        logoH + SERIES_FOOT.padY * 2
      );

    } else if (scoreMetrics){
      graphFooterH = Math.max(
        GRAPH_FOOTER.minH,
        scoreMetrics.totalH +
        SERIES_FOOT.padY * 2
      );
    }
  }

  activeCanvas.height =
    GRAPH.H +
    (graphHasFooter
      ? GRAPH_FOOTER.gapAbove
      : 0) +
    graphFooterH;

  activeCtx.clearRect(
    0,
    0,
    activeCanvas.width,
    activeCanvas.height
  );

  drawGraphBackground(
    activeCanvas.width,
    activeCanvas.height
  );

  const { points, spans } =
    buildEpisodeTimeline(seasons, rows);

  const values =
    points.map(p => p.value);

  const yDomain =
    computeGraphYDomain(values);

  const scales =
    makeGraphScales(
      points.length,
      yDomain
    );

  /* zones et labels des saisons */
  drawSeasonBandsAndLabels(
    spans,
    scales.x,
    points.length
  );

  /* axes + grille */
  drawGraphBase(yDomain);

  /* =========================
     LIGNE ÉPISODES
  ========================= */

  const rawCanvasPoints =
    points.map(
      (point, index) =>
        point.value == null
          ? null
          : {
              x: scales.x(index),
              y: scales.y(point.value)
            }
    );

  for (
    const segment of
    splitNumericSegments(rawCanvasPoints)
  ){
    drawSmoothPath(
      segment,
      GRAPH.rawLineColor,
      GRAPH.rawLineWidth,
      1
    );
  }

  /* points individuels */
  drawEpisodeDots(
    points,
    scales
  );

  /* =========================
     TRENDLINE
  ========================= */

  if (
    graphTrendline &&
    points.length > 1
  ){
    const smoothed =
      gaussianTrend(values);

    const trendPoints =
      smoothed.map(
        (value, index) =>
          value == null
            ? null
            : {
                x: scales.x(index),
                y: scales.y(value)
              }
      );

    for (
      const segment of
      splitNumericSegments(trendPoints)
    ){
      drawSmoothPath(
        segment,
        GRAPH.trendColor,
        GRAPH.trendWidth,
        0.72
      );
    }
  }

  /* =========================
     FOOTER
  ========================= */

  drawGraphSeriesFooter(rows);
}

function renderSeasonalGraph(seasons, rows){
activeCanvas.width = GRAPH.W;

const graphHasFooter =
  !!logoImage ||
  parseSeriesScoreInput() != null;

let graphFooterH = 0;

if (graphHasFooter){
  const scoreMetrics =
    measureSeriesScoreBlock(rows);

  const { h: logoH } =
    getLogoScaledSize();

  if (logoImage && scoreMetrics){
    graphFooterH = Math.max(
      GRAPH_FOOTER.minH,
      SERIES_FOOT.stackTopPad +
      logoH +
      SERIES_FOOT.gapUnderLogo +
      scoreMetrics.totalH +
      SERIES_FOOT.padY
    );
  } else if (logoImage){
    graphFooterH = Math.max(
      GRAPH_FOOTER.minH,
      logoH + SERIES_FOOT.padY * 2
    );
  } else if (scoreMetrics){
    graphFooterH = Math.max(
      GRAPH_FOOTER.minH,
      scoreMetrics.totalH +
      SERIES_FOOT.padY * 2
    );
  }
}

activeCanvas.height =
  GRAPH.H +
  (graphHasFooter ? GRAPH_FOOTER.gapAbove : 0) +
  graphFooterH;

  activeCtx.clearRect(
    0,
    0,
    activeCanvas.width,
    activeCanvas.height
  );

drawGraphBackground(
  activeCanvas.width,
  activeCanvas.height
);

  const items = computeSeasonAverages(
    seasons,
    rows
  ).filter(
    item =>
      typeof item.avg === "number" &&
      Number.isFinite(item.avg)
  );

  const values = items.map(item => item.avg);

  const yDomain = computeGraphYDomain(values);

  const scales = makeGraphScales(
    items.length,
    yDomain
  );

  drawGraphBase(yDomain);

  const plotBottom = GRAPH.H - GRAPH.bottom;

  /* =========================
     LABELS S1 / S2 / S3...
  ========================= */

  activeCtx.save();

  activeCtx.font =
    "600 11px -apple-system,system-ui,Segoe UI,Roboto,Arial";

  activeCtx.textAlign = "center";
  activeCtx.textBaseline = "top";
  activeCtx.fillStyle = GRAPH.labelColor;

  items.forEach((item, index) => {
    activeCtx.fillText(
      item.title,
      scales.x(index),
      plotBottom + 9
    );
  });

  activeCtx.restore();


  /* =========================
     LIGNE NORMALE ENTRE SAISONS
  ========================= */

  const rawPoints = items.map(
    (item, index) => ({
      x: scales.x(index),
      y: scales.y(item.avg)
    })
  );

  if (rawPoints.length > 1){
    drawSmoothPath(
      rawPoints,
      GRAPH.rawLineColor,
      GRAPH.rawLineWidth,
      1
    );
  }


  /* =========================
     TRENDLINE
  ========================= */

  if (graphTrendline && values.length > 1){

    /*
      Rayon dynamique pour éviter que la trendline
      disparaisse sur les séries avec peu de saisons.
    */
    let trendValues;

    if (values.length === 2){
      trendValues = [...values];

    } else if (values.length === 3){
      trendValues = gaussianTrend(
        values,
        1,
        1.15
      );

    } else if (values.length <= 6){
      trendValues = gaussianTrend(
        values,
        1,
        1.25
      );

    } else {
      trendValues = gaussianTrend(
        values,
        2,
        1.5
      );
    }

    const trendPoints = trendValues.map(
      (value, index) => ({
        x: scales.x(index),
        y: scales.y(value)
      })
    );

    drawSmoothPath(
      trendPoints,
      GRAPH.trendColor,
      GRAPH.trendWidth,
      0.72
    );
  }


  /* =========================
     POINTS + NOTES
  ========================= */

  activeCtx.save();

  items.forEach((item, index) => {

    const shown =
      Math.round(item.avg * 10) / 10;

    const bucket = pickBucket(
      shown,
      MIN_SCORE,
      MAX_SCORE
    );

    const x = scales.x(index);
    const y = scales.y(shown);


    /* POINT */

    activeCtx.beginPath();

    activeCtx.arc(
      x,
      y,
      GRAPH.seasonDotR,
      0,
      Math.PI * 2
    );

    activeCtx.fillStyle = bucket.color;
    activeCtx.fill();

    activeCtx.strokeStyle =
      "rgba(0,0,0,.75)";

    activeCtx.lineWidth = 2;
    activeCtx.stroke();


    /* NOTE */

    activeCtx.font =
      "700 13px -apple-system,system-ui,Segoe UI,Roboto,Arial";

    activeCtx.textAlign = "center";
    activeCtx.textBaseline = "bottom";

    activeCtx.fillStyle = bucket.color;

    activeCtx.shadowColor =
      "rgba(0,0,0,.95)";

    activeCtx.shadowBlur = 4;

    activeCtx.fillText(
      formatScore(shown),
      x,
      y - 13
    );

    activeCtx.shadowBlur = 0;
  });

  activeCtx.restore();


/* Logo + note globale sous le graphique */

drawGraphSeriesFooter(rows);
}

/* =========================
   GRAPH FOOTER
========================= */
function drawGraphSeriesFooter(rows){
  const hasScore =
    parseSeriesScoreInput() != null;
  const hasLogo =
    !!logoImage;
  if (!hasScore && !hasLogo){
    return;
  }

  const W = activeCanvas.width;

  const footerTop =
    GRAPH.H +
    GRAPH_FOOTER.gapAbove;

  const footerH =
    activeCanvas.height -
    footerTop;

  const stack =
    hasLogo && hasScore;

  const logoRect =
    stack
      ? drawLogoInFooterStacked(
          W,
          footerTop
        )
      : hasLogo
        ? drawLogoInFooterCentered(
            W,
            footerTop,
            footerH
          )
        : null;

  drawSeriesScoreFooter(
    W,
    footerTop,
    footerH,
    logoRect,
    rows
  );
}

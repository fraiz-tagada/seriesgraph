<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Grid notes (fidèle + export + fond + logo + mode seasonal/film) — iOS friendly</title>

  <style>
    :root{
      --bg:#05070d;
      --panel: rgba(255,255,255,.07);
      --border: rgba(255,255,255,.16);
      --text: rgba(255,255,255,.94);
      --muted: rgba(255,255,255,.66);

      --glass-hi: rgba(255,255,255,.15);
      --glass-mid: rgba(255,255,255,.085);
      --glass-low: rgba(255,255,255,.045);
      --glass-stroke: rgba(255,255,255,.18);
      --glass-shadow: rgba(0,0,0,.28);
      --accent:#0A84FF;

      --tap: 44px;
      --sheetPad: 12px;
      --sheetRadius: 18px;
    }

    html,body{
      height:100%;
      margin:0;
      color:var(--text);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      background:
        radial-gradient(900px 560px at 18% -8%, rgba(255,255,255,.065), transparent 62%),
        radial-gradient(760px 520px at 92% 8%, rgba(76,125,210,.07), transparent 64%),
        linear-gradient(180deg,#101319 0%,#0b0e13 46%,#080a0e 100%);
      background-attachment:fixed;
    }

    .wrap{
      max-width:980px;
      margin:0 auto;
      padding:18px;
      padding-bottom: calc(18px + env(safe-area-inset-bottom));
    }

    .ui{
      position:relative;
      overflow:hidden;
      isolation:isolate;

      border:1px solid rgba(255,255,255,.075);
      background:rgba(255,255,255,.022);

      border-radius:22px;
      padding:14px;
      margin-bottom:14px;

      -webkit-backdrop-filter:
        blur(40px)
        saturate(185%)
        brightness(1.06);

      backdrop-filter:
        blur(40px)
        saturate(185%)
        brightness(1.06);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.09),
        inset 0 -1px 0 rgba(255,255,255,.012),
        0 10px 28px rgba(0,0,0,.14);
    }

    .ui::before{
      content:"";
      position:absolute;
      inset:0;
      z-index:-1;
      pointer-events:none;
      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,.075) 0%,
          rgba(255,255,255,.025) 18%,
          transparent 42%
        );
    }

    .ui::after{
      content:"";
      position:absolute;
      inset:1px;
      z-index:-1;
      pointer-events:none;
      border-radius:21px;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.015);
    }

    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:space-between
    }
    .left,.right{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center
    }

    button{
      min-height:var(--tap);
      border:1px solid rgba(255,255,255,.075);
      background:rgba(255,255,255,.028);
      color:var(--text);
      border-radius:12px;
      padding:8px 11px;
      font-weight:700;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      touch-action:manipulation;
      user-select:none;

      -webkit-backdrop-filter:blur(24px) saturate(165%);
      backdrop-filter:blur(24px) saturate(165%);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.055),
        0 2px 8px rgba(0,0,0,.07);

      transition:
        background 140ms ease,
        border-color 140ms ease,
        transform 100ms ease;
    }

    button:hover{
      background:rgba(255,255,255,.05);
      border-color:rgba(255,255,255,.11);
    }
    button:active{
      transform:translateY(1px) scale(.992);
      box-shadow:
        inset 0 1px 4px rgba(0,0,0,.10),
        0 2px 7px rgba(0,0,0,.10);
    }

    .ghost{
      background:rgba(255,255,255,.016);
    }

    .switch{display:flex;align-items:center;gap:10px}
    .switch span{color:var(--muted);font-weight:700;font-size:13px}

    .mode-group{
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
    }

    .mode-primary-row{
      display:flex;
      align-items:center;
      justify-content:flex-start;
      gap:10px;
      width:100%;
    }

    .mode-primary-row #exportBtn{
      margin-left:0;
      white-space:nowrap;
      flex:0 0 auto;
    }

    .mode-label{
      color:var(--muted);
      font-size:13px;
      font-weight:700;
    }

    .segmented{
      display:flex;
      align-items:center;
      gap:2px;
      padding:3px;
      border:1px solid rgba(255,255,255,.065);
      border-radius:13px;
      background:rgba(0,0,0,.08);

      -webkit-backdrop-filter:blur(22px) saturate(160%);
      backdrop-filter:blur(22px) saturate(160%);

      box-shadow:inset 0 1px 0 rgba(255,255,255,.025);
    }

    .segmented button{
      min-height:36px;
      padding:6px 14px;
      border:0;
      border-radius:9px;
      background:transparent;
      color:var(--muted);
      font-size:14px;
      font-weight:750;
      transition:background 160ms ease,color 160ms ease;
    }

    .segmented button:hover{color:var(--text);}

    .segmented button.active{
      color:#fff;
      background:rgba(255,255,255,.095);
      border-color:rgba(255,255,255,.09);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.05),
        0 1px 4px rgba(0,0,0,.08);
    }

    .view-options{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      width:100%;
      margin-top:2px;
    }

    .data-section{
      margin-top:14px;
      padding:12px;
      border:1px solid rgba(255,255,255,.05);
      border-radius:16px;
      background:rgba(255,255,255,.012);

      -webkit-backdrop-filter:blur(28px) saturate(165%);
      backdrop-filter:blur(28px) saturate(165%);
    }

    .data-section .legend{
      margin-top:0;
      margin-bottom:10px;
    }

    .toggle{
      width:69px;
      height:20px;
      border-radius:999px;
      border:1px solid var(--border);
      background: rgba(255,255,255,.14);
      position:relative;
      padding:0;
      cursor:pointer;
      transition: background-color 180ms ease, border-color 180ms ease;
    }

    .toggle[aria-checked="true"]{
      background:
        linear-gradient(180deg, rgba(38,155,255,.98), rgba(10,132,255,.90));
      border-color:rgba(92,177,255,.88);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.28),
        0 4px 12px rgba(10,132,255,.20);
    }

    .thumb{
      width:22px;
      height:22px;
      border-radius:999px;
      background:#ffffff;
      position:absolute;
      top:50%;
      left:3px;
      transform:translateY(-50%);
      transition:left 180ms cubic-bezier(.4,0,.2,1);
    }
    .toggle[aria-checked="true"] .thumb{left:42px;}

    .legend{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      align-items:center;
      margin-top:10px
    }
    .leg-item{
      display:flex;
      align-items:center;
      gap:7px;
      font-size:13px;
      color:var(--muted);
      font-weight:700
    }
    .swatch{
      width:14px;height:14px;border-radius:4px;
      border:1px solid rgba(255,255,255,.18)
    }

    textarea{
      width:100%;
      min-height:140px;
      box-sizing:border-box;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.06);
      background:rgba(0,0,0,.10);
      color:var(--text);
      padding:12px;
      outline:none;
      font:575 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      margin-top:10px;

      -webkit-backdrop-filter:blur(18px) saturate(150%);
      backdrop-filter:blur(18px) saturate(150%);

      box-shadow:inset 0 1px 0 rgba(255,255,255,.018);
    }

    textarea:focus,
    .smallInput:focus,
    .imdb-loader input[type="text"]:focus,
    select:focus{
      border-color:rgba(10,132,255,.52);
      box-shadow:0 0 0 3px rgba(10,132,255,.10);
    }

    .hint{color:var(--muted);font-size:13px;line-height:1.35;margin:8px 0 0}

    label{
      color:var(--muted);
      font-size:13px;
      font-weight:700;
      display:flex;
      align-items:center;
      gap:8px
    }

    input[type="file"]{color:var(--muted);font-size:13px}

    button,
    input,
    select,
    textarea{
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    }


    select{
      min-height:var(--tap);
      border-radius:11px;
      border:1px solid rgba(255,255,255,.07);
      background:rgba(255,255,255,.022);
      color:var(--text);
      padding:7px 10px;
      outline:none;
      font-weight:750;
      font-size:16px;

      -webkit-backdrop-filter:blur(22px) saturate(165%);
      backdrop-filter:blur(22px) saturate(165%);

      box-shadow:inset 0 1px 0 rgba(255,255,255,.025);
    }

    .smallInput{
      min-height:var(--tap);
      width:130px;
      border-radius:11px;
      border:1px solid rgba(255,255,255,.07);
      background:rgba(255,255,255,.022);
      color:var(--text);
      padding:7px 10px;
      outline:none;
      font-weight:750;
      font-size:16px;

      -webkit-backdrop-filter:blur(22px) saturate(165%);
      backdrop-filter:blur(22px) saturate(165%);

      box-shadow:inset 0 1px 0 rgba(255,255,255,.025);
    }

    .imdb-loader{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      margin-top:14px;
      padding:12px;

      border:1px solid rgba(255,255,255,.055);
      border-radius:16px;
      background:rgba(255,255,255,.014);

      -webkit-backdrop-filter:blur(30px) saturate(175%);
      backdrop-filter:blur(30px) saturate(175%);

      box-shadow:inset 0 1px 0 rgba(255,255,255,.018);
    }


.series-meta-row{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  flex-basis:100%;
  width:100%;
  padding-bottom:12px;
  margin-bottom:2px;
  border-bottom:1px solid rgba(255,255,255,.075);
}


.imdb-loader input[type="text"]{
  min-height:var(--tap);
  width:180px;
  box-sizing:border-box;
  border-radius:11px;
  border:1px solid rgba(255,255,255,.07);
  background:rgba(255,255,255,.022);
  color:var(--text);
  padding:7px 10px;
  outline:none;
  font:650 16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;

  -webkit-backdrop-filter:blur(22px) saturate(165%);
  backdrop-filter:blur(22px) saturate(165%);

  box-shadow:inset 0 1px 0 rgba(255,255,255,.025);
}

.imdb-loader button:disabled{
  cursor:default;
  opacity:.55;
  transform:none;
}

.imdb-status{
  flex-basis:100%;
  width:100%;
  min-height:18px;
  margin:0;
  color:var(--muted);
  font-size:13px;
  font-weight:650;
  line-height:1.35;
}

.imdb-status[data-error="true"]{
  color:#ff8b8b;
}

    canvas{
      width:100%;
      height:auto;
      border-radius:20px;
      display:block;
      background:#000;
      touch-action:manipulation;

      border:1px solid rgba(255,255,255,.055);
      box-shadow:0 10px 28px rgba(0,0,0,.18);
    }

    .hidden{display:none !important;}

    @media (max-width: 760px){
      .ui{
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        margin: 0;
        border-radius: var(--sheetRadius) var(--sheetRadius) 0 0;
        padding: var(--sheetPad);
        padding-bottom: calc(var(--sheetPad) + env(safe-area-inset-bottom));
        z-index: 9999;
        max-width: none;
        border-left: none;
        border-right: none;
        max-height: 55vh;
        overflow: auto;
        -webkit-overflow-scrolling: touch;
      }

      .wrap{
        padding: 12px;
        padding-bottom: calc(55vh + env(safe-area-inset-bottom) + 12px);
      }

      :root{
        --safe-top: env(safe-area-inset-top);
        --safe-bottom: env(safe-area-inset-bottom);
        --safe-left: env(safe-area-inset-left);
        --safe-right: env(safe-area-inset-right);
      }

      html, body{ height: 100%; }

      .wrap{
        max-width:980px;
        margin:0 auto;
        padding:
          calc(16px + var(--safe-top))
          calc(16px + var(--safe-right))
          calc(16px + var(--safe-bottom))
          calc(16px + var(--safe-left));
      }

      .ui{
        position: sticky;
        top: calc(0px + var(--safe-top));
        z-index: 10;

        border:1px solid rgba(255,255,255,.07);
        background:rgba(255,255,255,.022);
        border-radius:20px;
        padding:12px;
        margin-bottom:12px;
        -webkit-backdrop-filter:blur(36px) saturate(175%);
        backdrop-filter:blur(36px) saturate(175%);
      }

      canvas{
        display:block;
        width:100%;
        height:auto;
        border-radius:18px;
        background:#000;
        margin-bottom: calc(16px + var(--safe-bottom));
      }

      .row{flex-direction: column; align-items: stretch; justify-content:flex-start;}
      .left,.right{width:100%; justify-content:flex-start;}
      .mode-primary-row,.mode-group,.view-options{width:100%;}
      .segmented{flex:1;}
      .segmented button{flex:1;}
      .hint{display:none;}
    }
  
  /* =========================================================
     APPLE-INSPIRED LIQUID GLASS — functional layer only
     Based on Apple's WWDC25 / HIG guidance:
     glass for controls/navigation, calmer materials for content.
  ========================================================= */

  :root{
    --apple-glass-fill: rgba(255,255,255,.055);
    --apple-glass-fill-hover: rgba(255,255,255,.09);
    --apple-glass-stroke: rgba(255,255,255,.12);
    --apple-glass-highlight: rgba(255,255,255,.16);
    --apple-content-fill: rgba(18,20,25,.70);
    --apple-content-stroke: rgba(255,255,255,.065);
    --apple-shadow: 0 10px 34px rgba(0,0,0,.22);
    --apple-radius-lg: 24px;
    --apple-radius-md: 18px;
    --apple-radius-sm: 13px;
  }

  html,body{
    background:
      radial-gradient(900px 500px at 14% -8%, rgba(255,255,255,.085), transparent 62%),
      radial-gradient(720px 460px at 92% 4%, rgba(91,126,185,.10), transparent 66%),
      radial-gradient(560px 360px at 50% 108%, rgba(68,95,132,.055), transparent 70%),
      linear-gradient(180deg,#11151c 0%,#0b0e13 48%,#07090d 100%) !important;
    background-attachment:fixed !important;
  }

  .wrap{
    max-width:980px;
    padding:18px;
  }

  /* Main container is NOT itself glass: it is just layout. */
  .ui{
    overflow:visible;
    isolation:auto;
    padding:0;
    margin-bottom:16px;
    border:0;
    border-radius:0;
    background:transparent;
    -webkit-backdrop-filter:none;
    backdrop-filter:none;
    box-shadow:none;
  }

  .ui::before,
  .ui::after{
    display:none;
  }

  .row{
    gap:12px;
    align-items:flex-start;
  }

  /* Functional Liquid Glass capsules */
  .mode-primary-row,
  .view-options,
  .right{
    position:relative;
    border:1px solid var(--apple-glass-stroke);
    background:
      linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.035)),
      rgba(255,255,255,.018);
    -webkit-backdrop-filter:blur(28px) saturate(165%) brightness(1.05);
    backdrop-filter:blur(28px) saturate(165%) brightness(1.05);
    box-shadow:
      inset 0 1px 0 var(--apple-glass-highlight),
      inset 0 -1px 0 rgba(255,255,255,.02),
      var(--apple-shadow);
  }

  .left{
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:9px;
    flex:1 1 470px;
    min-width:0;
  }

  .mode-primary-row{
    width:auto;
    min-height:50px;
    box-sizing:border-box;
    padding:6px;
    border-radius:19px;
  }

  .mode-primary-row::before,
  .view-options::before,
  .right::before{
    content:"";
    position:absolute;
    inset:1px;
    pointer-events:none;
    border-radius:inherit;
    background:
      linear-gradient(180deg, rgba(255,255,255,.055), transparent 34%);
    opacity:.8;
  }

  .mode-group,
  .mode-primary-row > #exportBtn,
  .view-options > *,
  .right > *{
    position:relative;
    z-index:1;
  }

  .mode-group{
    gap:7px;
    flex-wrap:nowrap;
  }

  .mode-label{
    padding-left:8px;
    color:rgba(255,255,255,.70);
    font-size:12px;
    letter-spacing:.01em;
  }

  .segmented{
    gap:2px;
    padding:2px;
    border:0;
    border-radius:14px;
    background:rgba(0,0,0,.14);
    -webkit-backdrop-filter:none;
    backdrop-filter:none;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.035);
  }

  .segmented button{
    min-height:36px;
    padding:6px 15px;
    border:0;
    border-radius:12px;
    background:transparent;
    box-shadow:none;
    color:rgba(255,255,255,.62);
    font-size:14px;
    font-weight:650;
  }

  .segmented button:hover{
    background:rgba(255,255,255,.045);
    border-color:transparent;
  }

  .segmented button.active{
    color:#fff;
    background:
      linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.10));
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.17),
      0 2px 8px rgba(0,0,0,.18);
  }

  #exportBtn{
    margin-left:2px;
    min-height:38px;
    padding-inline:14px;
    border-radius:13px;
    border:1px solid rgba(255,255,255,.095);
    background:rgba(255,255,255,.065);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10);
  }

  #exportBtn:hover{
    background:rgba(255,255,255,.105);
  }

  .view-options{
    width:auto;
    min-height:48px;
    box-sizing:border-box;
    margin-top:0;
    padding:6px 10px;
    border-radius:17px;
    gap:14px;
  }

  .right{
    flex:1 1 360px;
    min-width:300px;
    padding:8px 10px;
    border-radius:19px;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:10px;
    align-content:flex-start;
  }

  label{
    color:rgba(255,255,255,.64);
    font-size:12px;
    font-weight:650;
  }

  /* Glass controls: restrained, almost clear until hovered. */
  button:not(.toggle):not(.segmented button),
  select,
  .smallInput,
  .imdb-loader input[type="text"]{
    border:1px solid rgba(255,255,255,.085);
    background:rgba(255,255,255,.045);
    color:rgba(255,255,255,.92);
    border-radius:12px;
    -webkit-backdrop-filter:blur(18px) saturate(145%);
    backdrop-filter:blur(18px) saturate(145%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.07),
      0 1px 5px rgba(0,0,0,.08);
  }

  button:not(.toggle):not(.segmented button):hover,
  select:hover{
    background:rgba(255,255,255,.075);
    border-color:rgba(255,255,255,.13);
  }

  select,
  .smallInput,
  .imdb-loader input[type="text"]{
    min-height:40px;
  }

  input[type="file"]{
    color:rgba(255,255,255,.66);
  }

  /* Toggle: closer to current Apple switches, compact and pill-shaped. */
  .toggle{
    width:48px;
    height:28px;
    min-height:28px;
    padding:0;
    border:1px solid rgba(255,255,255,.10);
    background:rgba(255,255,255,.10);
    box-shadow:
      inset 0 1px 2px rgba(0,0,0,.16),
      inset 0 1px 0 rgba(255,255,255,.055);
  }

  .thumb{
    width:24px;
    height:24px;
    top:1px;
    left:2px;
    transform:none;
    box-shadow:0 2px 6px rgba(0,0,0,.24);
  }

  .toggle[aria-checked="true"]{
    background:#0A84FF;
    border-color:rgba(66,160,255,.95);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.20),
      0 2px 8px rgba(10,132,255,.18);
  }

  .toggle[aria-checked="true"] .thumb{
    left:21px;
  }

  /* Content/material layer: intentionally NOT Liquid Glass. */
  .imdb-loader,
  .data-section{
    border:1px solid var(--apple-content-stroke);
    background:var(--apple-content-fill);
    -webkit-backdrop-filter:blur(14px) saturate(115%);
    backdrop-filter:blur(14px) saturate(115%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.025),
      0 8px 24px rgba(0,0,0,.13);
  }

  .imdb-loader{
    margin-top:12px;
    padding:12px;
    border-radius:20px;
  }

  .series-meta-row{
    border-bottom:1px solid rgba(255,255,255,.06);
    padding-bottom:11px;
    margin-bottom:1px;
  }

  .data-section{
    margin-top:12px;
    padding:12px;
    border-radius:20px;
  }

  textarea{
    background:rgba(0,0,0,.19);
    border:1px solid rgba(255,255,255,.065);
    border-radius:15px;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.02),
      inset 0 0 18px rgba(0,0,0,.08);
    -webkit-backdrop-filter:none;
    backdrop-filter:none;
  }

  textarea:focus,
  .smallInput:focus,
  .imdb-loader input[type="text"]:focus,
  select:focus{
    border-color:rgba(10,132,255,.48);
    box-shadow:0 0 0 3px rgba(10,132,255,.10);
  }

  .legend{
    gap:13px;
  }

  .leg-item{

  .view-options{

    min-height:48px;
    padding:6px 9px !important;
  }

  /* ---------------------------------------------------------
     Segmented control — one shared slab, selected item inset
  --------------------------------------------------------- */

  .segmented{
    padding:3px !important;
    gap:2px !important;

    border:1px solid rgba(255,255,255,.045) !important;
    border-radius:17px !important;

    background:rgba(0,0,0,.22) !important;

    -webkit-backdrop-filter:none !important;
    backdrop-filter:none !important;

    box-shadow:
      inset 0 1px 2px rgba(0,0,0,.28),
      inset 0 1px 0 rgba(255,255,255,.025) !important;
  }

  .segmented button{
    min-height:36px !important;
    padding-inline:15px !important;
    border:0 !important;
    border-radius:14px !important;

    background:transparent !important;
    color:rgba(255,255,255,.68) !important;

    box-shadow:none !important;
  }

  .segmented button:hover{
    background:rgba(255,255,255,.035) !important;
    color:rgba(255,255,255,.90) !important;
  }

  .segmented button.active{
    color:#fff !important;

    background:
      linear-gradient(
        180deg,
        rgba(255,255,255,.125),
        rgba(255,255,255,.055)
      ),
      rgba(0,0,0,.20) !important;

    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.14),
      inset 0 -1px 0 rgba(255,255,255,.025),
      0 2px 9px rgba(0,0,0,.22) !important;

  /* ---------------------------------------------------------
     Buttons, selects and inputs
  --------------------------------------------------------- */

  button:not(.toggle):not(.segmented button),
  select,
  .smallInput,
  .imdb-loader input[type="text"]{
    border:1px solid var(--lg-border-soft) !important;
    border-radius:14px !important;

    background:
      linear-gradient(
        180deg,
        rgba(255,255,255,.055),
        rgba(255,255,255,.025)

      rgba(28,28,30,.34) !important;

    color:rgba(255,255,255,.92) !important;

    -webkit-backdrop-filter:
      blur(18px)
      saturate(125%) !important;

    backdrop-filter:
      blur(18px)
      saturate(125%) !important;

    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.075),
      0 2px 7px rgba(0,0,0,.12) !important;
  }

  button:not(.toggle):not(.segmented button):hover,
  select:hover{
    background:
      linear-gradient(
        180deg,
        rgba(255,255,255,.080),
        rgba(255,255,255,.038)

      rgba(28,28,30,.40) !important;

  }

    transform:scale(.97) !important;
  }

  #exportBtn{
    min-height:38px !important;
    padding-inline:14px !important;
    border-radius:15px !important;

    background:
      linear-gradient(
        180deg,
        rgba(255,255,255,.075),
        rgba(255,255,255,.030)
      ),
      rgba(28,28,30,.42) !important;
  }

  .right .ghost{
    background:
      linear-gradient(
        180deg,
        rgba(255,255,255,.050),
        rgba(255,255,255,.020)
      ),
      rgba(28,28,30,.34) !important;
  }

  /* ---------------------------------------------------------
     Toggle
  --------------------------------------------------------- */

  .toggle{
    width:50px !important;
    height:30px !important;
    min-height:30px !important;
    padding:0 !important;

    border-radius:999px !important;
    border:1px solid rgba(255,255,255,.085) !important;

    box-shadow:
      inset 0 1px 2px rgba(0,0,0,.22),
      inset 0 1px 0 rgba(255,255,255,.045) !important;
  }

  .thumb{
    width:26px !important;
    height:26px !important;
    top:1px !important;
    left:2px !important;

    background:#fff !important;

    box-shadow:
      0 2px 7px rgba(0,0,0,.30),
      inset 0 1px 0 rgba(255,255,255,.75) !important;
  }

  .toggle[aria-checked="true"]{
    background:#0A84FF !important;
    border-color:rgba(74,166,255,.90) !important;
  }

  .toggle[aria-checked="true"] .thumb{
    left:21px !important;

  /* ---------------------------------------------------------
     Content cards — darker, calmer, less glassy
  --------------------------------------------------------- */

  .imdb-loader,
  .data-section{
    border:1px solid rgba(255,255,255,.060) !important;

    background:
      linear-gradient(
        180deg,
        rgba(255,255,255,.018),
        rgba(255,255,255,.004)
      ),
      rgba(15,16,20,.82) !important;

    -webkit-backdrop-filter:blur(12px) saturate(108%) !important;
    backdrop-filter:blur(12px) saturate(108%) !important;

    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.025),
      0 9px 22px rgba(0,0,0,.17) !important;

  .data-section{
    border-radius:24px !important;
  }

  textarea{
    border:1px solid rgba(255,255,255,.060) !important;
    border-radius:18px !important;

    background:rgba(5,6,8,.72) !important;

    -webkit-backdrop-filter:none !important;
    backdrop-filter:none !important;

    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.018),
      inset 0 0 20px rgba(0,0,0,.10) !important;
  }

  /* ---------------------------------------------------------
     Labels / small typography
  --------------------------------------------------------- */

  .mode-label,
  label,
  .switch span{
    color:rgba(255,255,255,.67) !important;
  }

  .leg-item{
    color:rgba(255,255,255,.66) !important;
  }

  /* ---------------------------------------------------------
     Canvas: keep it completely independent from glass layers
  --------------------------------------------------------- */

  canvas{
    display:block !important;
    visibility:visible !important;
    opacity:1 !important;

    position:static !important;
    z-index:auto !important;

    transform:none !important;
    -webkit-transform:none !important;

    filter:none !important;
    isolation:auto !important;
    contain:none !important;
    will-change:auto !important;

    width:100% !important;
    height:auto !important;

    background:#04060c !important;

    border:1px solid rgba(255,255,255,.045) !important;
    border-radius:24px !important;

    box-shadow:
      0 14px 34px rgba(0,0,0,.24) !important;
  }

  /* ---------------------------------------------------------
     Mobile / iPhone
  --------------------------------------------------------- */

  @media (max-width:760px){
    html,
    body,
    .wrap{
      background:var(--lg-bg) !important;
      background-image:none !important;
    }

    .ui{
      position:relative !important;
      inset:auto !important;
      top:auto !important;
      right:auto !important;
      bottom:auto !important;
      left:auto !important;

      z-index:auto !important;

      width:auto !important;
      max-width:none !important;
      max-height:none !important;

      overflow:visible !important;

      margin-bottom:14px !important;

      -webkit-backdrop-filter:none !important;
      backdrop-filter:none !important;
    }

    .wrap{
      padding:
        calc(12px + var(--safe-top))
        calc(12px + var(--safe-right))
        calc(18px + var(--safe-bottom))
        calc(12px + var(--safe-left)) !important;
    }

    .top-toolbar-row{
      flex-wrap:wrap !important;
      gap:8px !important;
    }

    .top-toolbar-row .left,
    .top-toolbar-row .right{
      width:100% !important;
      flex:1 1 100% !important;
      min-width:0 !important;
    }

    .top-toolbar-row .right{
      flex-wrap:wrap !important;
      gap:8px !important;
    }

    .mode-primary-row,
    .right,
    .view-options{
      width:100% !important;
      box-sizing:border-box !important;

      -webkit-backdrop-filter:
        blur(24px)
        saturate(120%) !important;

      backdrop-filter:
        blur(24px)
        saturate(120%) !important;
    }

    .mode-group{
      flex:1 1 auto !important;
      min-width:0 !important;
    }

    .segmented{
      flex:1 1 auto !important;
      min-width:0 !important;
    }

    .segmented button{
      flex:1 1 0 !important;
      min-width:0 !important;
      padding-inline:8px !important;
    }

    #exportBtn{
      flex:0 0 auto !important;
    }

    .right input[type="file"]{
      max-width:135px !important;
    }

    .view-options{
      flex-wrap:wrap !important;
    }

    canvas{
      position:static !important;
      z-index:auto !important;

      margin-top:14px !important;
      margin-bottom:calc(18px + var(--safe-bottom)) !important;

      transform:none !important;
      -webkit-transform:none !important;

      -webkit-backface-visibility:visible !important;
      backface-visibility:visible !important;
    }
  }

  /* ---------------------------------------------------------
     Fallback when backdrop-filter is unavailable
  --------------------------------------------------------- */

  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    .mode-primary-row,
    .right,
    .view-options{
      background:rgba(30,30,32,.94) !important;
    }

    button:not(.toggle):not(.segmented button),
    select,
    .smallInput,
    .imdb-loader input[type="text"]{
      background:rgba(38,38,40,.96) !important;
    }
  }

  @media (prefers-reduced-motion:reduce){
    button,
    .thumb,
    .mode-primary-row::before,
    .right::before,
    .view-options::before{
      transition:none !important;
    }
  }

/* =========================================================
   UI UNIFORMITY PASS — keeps the existing Dark Liquid Glass DNA
   Normalizes control sizing, radii, states and semantic accents.
========================================================= */
:root{
  --ui-control-h:40px;
  --ui-control-radius:14px;
  --ui-control-border:rgba(255,255,255,.085);
  --ui-control-fill-top:rgba(255,255,255,.055);
  --ui-control-fill-bottom:rgba(255,255,255,.024);
  --ui-control-base:rgba(28,28,30,.34);
  --ui-control-hover:rgba(28,28,30,.42);
  --ui-focus:rgba(10,132,255,.16);
  --ui-blue:#0A84FF;
  --ui-red:#FF453A;
}

/* One type rhythm across all interactive controls. */
button,
select,
input,
textarea{
  letter-spacing:-.01em;
}

button:not(.toggle):not(.segmented button),
select,
.smallInput,
.imdb-loader input[type="text"]{
  min-height:var(--ui-control-h) !important;
  border-radius:var(--ui-control-radius) !important;
  border-color:var(--ui-control-border) !important;
  font-size:14px;
  font-weight:650;
}

/* Neutral buttons all share the same glass recipe. */
button:not(.toggle):not(.segmented button):not(#exportBtn):not(#clearBgBtn):not(#clearLogoBtn):not(#cardBgClearOneBtn):not(#cardBgClearAllBtn):not(#fetchImdbBtn){
  background:
    linear-gradient(180deg,var(--ui-control-fill-top),var(--ui-control-fill-bottom)),
    var(--ui-control-base) !important;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.075),
    0 2px 7px rgba(0,0,0,.12) !important;
}

button:not(.toggle):not(.segmented button):not(#exportBtn):not(#clearBgBtn):not(#clearLogoBtn):not(#cardBgClearOneBtn):not(#cardBgClearAllBtn):not(#fetchImdbBtn):hover{
  background:
    linear-gradient(180deg,rgba(255,255,255,.078),rgba(255,255,255,.035)),
    var(--ui-control-hover) !important;
  border-color:rgba(255,255,255,.125) !important;
}

function clamp(x,a,b){ return Math.max(a, Math.min(b, x)); }
const px = (n) => Math.round(n);

function mulberry32(a){
  return function(){
    let t = a += 0x6D2B79F5;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function drawTextCentered(text, cx, cy){

  activeCtx.textBaseline = "alphabetic";
  activeCtx.fillText(text, px(cx), px(y));
}

function parseCSV(text){
  const lines = text.trim().split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if (!lines.length) return { seasons:[], rows:[] };

  const seasons = lines[0].split(",").map((s,i)=> (s.trim() || `S${i+1}`));
  const rows = [];

  for (let i=1;i<lines.length;i++){
    const parts = lines[i].split(",").map(s=>s.trim());
    rows.push(parts.map(p=>{
      if (!p || p.toUpperCase() === "NA") return null;
      if (p.toUpperCase() === "X") return "X";
      const v = Number(p.replace(",", "."));
      return Number.isFinite(v) ? v : null;
    }));
  }
  return { seasons, rows };
}

function avg(arr){
  const vals = arr.filter(v => typeof v === "number" && !Number.isNaN(v));
  if (!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}

function pickBucket(score, minScore, maxScore){
  if (typeof score !== "number" || Number.isNaN(score)) return missing;
  const s = clamp(score, minScore, maxScore);
  for (const r of ranges){
    if (s >= r.min && s <= r.max) return r;
  }
  return missing;
}

function roundRectPath(x,y,w,h,r){
  const rr = Math.min(r, w/2, h/2);
  activeCtx.beginPath();
  activeCtx.moveTo(x+rr, y);
  activeCtx.arcTo(x+w, y, x+w, y+h, rr);
  activeCtx.arcTo(x+w, y+h, x, y+h, rr);
  activeCtx.arcTo(x, y+h, x, y, rr);
  activeCtx.arcTo(x, y, x+w, y, rr);
  activeCtx.closePath();
}

function drawBackground(W,H){
  activeCtx.save();
  activeCtx.shadowColor = "rgba(0,0,0,0)";
  activeCtx.shadowBlur = 0;
  activeCtx.shadowOffsetX = 0;
  activeCtx.shadowOffsetY = 0;

  activeCtx.fillStyle = "#04060c";
  activeCtx.fillRect(0,0,W,H);

  if (bgImage){
    const s = Math.max(W/bgImage.width, H/bgImage.height);
    const iw = bgImage.width*s, ih = bgImage.height*s;
    const ix = (W-iw)/2, iy = (H-ih)/2;
    activeCtx.globalAlpha = 0.92;
    activeCtx.drawImage(bgImage, ix, iy, iw, ih);
    activeCtx.globalAlpha = 1;
    activeCtx.fillStyle = "rgba(0,0,0,.55)";
    activeCtx.fillRect(0,0,W,H);
  } else {
    const rand = mulberry32(123456 ^ (W*73856093) ^ (H*19349663));
    activeCtx.fillStyle = "rgba(255,255,255,.03)";
    for (let i=0;i<60;i++){
      const x=rand()*W, y=rand()*H, r=2+rand()*8;
      activeCtx.beginPath(); activeCtx.arc(x,y,r,0,Math.PI*2); activeCtx.fill();
    }
    activeCtx.fillStyle = "rgba(0,0,0,.35)";
    activeCtx.fillRect(0,0,W,H);
  }

  activeCtx.restore();
}

function getLogoScaledSize(){
  if (!logoImage) return { w: 0, h: 0, s: 1 };
  const iw = logoImage.width;
  const ih = logoImage.height;

  let s = Math.sqrt(LOGO.targetArea / (iw * ih));
  s = Math.min(s, LOGO.maxW / iw, LOGO.maxH / ih);
  s = Math.min(s, LOGO.maxUpscale);

  const w = Math.round(iw * s);
  const h = Math.round(ih * s);
  return { w, h, s };
}

/* mode "stack": logo en haut à droite (pas centré) */
function drawLogoInFooterStacked(W, footerTop){
  if (!logoImage) return null;
  const { w, h } = getLogoScaledSize();
  const x = W - LOGO.padX - w;
  const y = Math.round(footerTop + SERIES_FOOT.stackTopPad + LOGO.yBias);

  activeCtx.save();
  activeCtx.shadowColor = "rgba(0,0,0,0)";
  activeCtx.shadowBlur = 0;
  activeCtx.shadowOffsetX = 0;
  activeCtx.shadowOffsetY = 0;
  activeCtx.globalAlpha = LOGO.opacity;
  activeCtx.drawImage(logoImage, x, y, w, h);
  activeCtx.restore();

  return { x, y, w, h };
}

/* mode normal: logo centré */
function drawLogoInFooterCentered(W, footerTop, footerH){
  if (!logoImage) return null;
  const { w, h } = getLogoScaledSize();

  const x = W - LOGO.padX - w;

}

/* =========================

========================= */
function parseSeriesScoreInput(){
  const raw = (seriesScoreEl?.value || "").trim();
  if (!raw) return null;
  const v = Number(raw.replace(",", "."));
  if (!Number.isFinite(v)) return null;
  return clamp(v, MIN_SCORE, MAX_SCORE);
}

function parseEpisodesOverride(){
  const raw = (seriesEpisodesOverrideEl?.value || "").trim();
  if (!raw) return null;
  if (raw.toUpperCase() === "X") return "X";
  const n = Number(raw);
  if (!Number.isFinite(n) || n <= 0) return null;
  return Math.floor(n);
}

function computeEpisodesAuto(rows){
  let c = 0;
  for (const r of rows){
    if (!r) continue;
    for (const v of r){
      if (v == null) continue;
      c++;
    }
  }
  return c || null;
}

function formatScore(value){
  if (value === 10) return "10";
  return value.toFixed(1);
}

function drawStarIcon(x, y, size, color){
  const cx = x + size/2;
  const cy = y + size/2;
  const spikes = 5;
  const outer = size * 0.50;
  const inner = size * 0.22;

  let rot = -Math.PI / 2;
  const step = Math.PI / spikes;

  activeCtx.save();
  activeCtx.beginPath();
  activeCtx.moveTo(cx, cy - outer);
  for (let i = 0; i < spikes; i++){
    activeCtx.lineTo(cx + Math.cos(rot) * outer, cy + Math.sin(rot) * outer);
    rot += step;
    activeCtx.lineTo(cx + Math.cos(rot) * inner, cy + Math.sin(rot) * inner);
    rot += step;
  }
  activeCtx.closePath();
  activeCtx.fillStyle = color;
  activeCtx.fill();
  activeCtx.restore();
}

/* mesure pour dimensionner footer correctement */
function measureSeriesScoreBlock(rows){
  const score = parseSeriesScoreInput();
  if (score == null) return null;

  const override = parseEpisodesOverride();
  const autoEp = computeEpisodesAuto(rows);
  const ep = (override != null) ? override : (autoEp != null ? autoEp : "X");

  const mainText = formatScore(Math.round(score * 10) / 10);
  const suffixText = "/10";
  const metaText = ` \u200A(${ep} episodes)`;

  activeCtx.save();

  activeCtx.font = L.fontSeriesScore;
  const mMain = activeCtx.measureText(mainText);
  const mainAscent = mMain.actualBoundingBoxAscent || 18;
  const mainDescent = mMain.actualBoundingBoxDescent || 6;

  activeCtx.font = L.fontSeriesScoreSuffix;
  const mSuffix = activeCtx.measureText(suffixText);
  const suffixAscent = mSuffix.actualBoundingBoxAscent || 11;
  const suffixDescent = mSuffix.actualBoundingBoxDescent || 4;

  activeCtx.font = L.fontSeriesMeta;
  const mMeta = activeCtx.measureText(metaText);
  const metaAscent = mMeta.actualBoundingBoxAscent || 18;
  const metaDescent = mMeta.actualBoundingBoxDescent || 6;

  const ascent = Math.max(mainAscent, suffixAscent, metaAscent);
  const descent = Math.max(mainDescent, suffixDescent, metaDescent);
  const lineH = ascent + descent;

  const starSize = SERIES_FOOT.starSize;
  const gap = SERIES_FOOT.gap;

  const totalW = starSize + gap + mMain.width + mSuffix.width + mMeta.width;
  const totalH = Math.max(starSize, lineH);

  activeCtx.restore();

  return {
    mainText,
    suffixText,
    metaText,
    totalW,
    totalH,
    ascent,
    mMainW: mMain.width,
    mSuffixW: mSuffix.width
  };
}

/* dessine note en footer (X jamais lié au logo) */

function computeStandardFooterHeight(rows, hasLogo = !!logoImage){
  const hasSeriesScore =
    parseSeriesScoreInput() != null;

  if (!hasLogo && !hasSeriesScore){
    return 0;
  }

  const m =
    hasSeriesScore
      ? measureSeriesScoreBlock(rows)
      : null;

  const { h: logoH } =
    getLogoScaledSize();

  if (hasLogo && hasSeriesScore && m){
    return Math.max(
      FOOTER.minH,
      SERIES_FOOT.stackTopPad +
      logoH +
      SERIES_FOOT.gapUnderLogo +
      m.totalH +
      SERIES_FOOT.padY
    );
  }

  if (hasLogo){
    return Math.max(
      FOOTER.minH,
      logoH +
      SERIES_FOOT.padY * 2
    );
  }

  if (hasSeriesScore && m){
    return Math.max(
      FOOTER.minH,
      m.totalH +
      SERIES_FOOT.padY * 2
    );
  }

  return FOOTER.minH;
}

function drawSeriesScoreFooter(W, footerTop, footerH, logoRectOrNull, rows){
  const m = measureSeriesScoreBlock(rows);
  if (!m) return;

  const anchorRight = (W - LOGO.padX);

  let topY;
  if (logoRectOrNull){
    topY = logoRectOrNull.y + logoRectOrNull.h + SERIES_FOOT.gapUnderLogo;
  } else {
    topY = footerTop + Math.round((footerH - m.totalH) / 2);
  }

  topY = clamp(topY, footerTop + SERIES_FOOT.padY, footerTop + footerH - m.totalH - SERIES_FOOT.padY);
  const xLeft = clamp(anchorRight - m.totalW, 12, W - 12 - m.totalW);

  const starY = topY + Math.round((m.totalH - SERIES_FOOT.starSize) / 2) - 3;
  const baselineY = topY + m.ascent;

  drawStarIcon(px(xLeft), px(starY), SERIES_FOOT.starSize, "orange");

  activeCtx.save();
  activeCtx.shadowColor = "rgba(0,0,0,0)";
  activeCtx.shadowBlur = 0;
  activeCtx.shadowOffsetX = 0;
  activeCtx.shadowOffsetY = 0;

  const textX = xLeft + SERIES_FOOT.starSize + SERIES_FOOT.gap;

  activeCtx.font = L.fontSeriesScore;
  activeCtx.fillStyle = "rgba(255,255,255,.95)";
  activeCtx.textAlign = "left";
  activeCtx.textBaseline = "alphabetic";
  activeCtx.fillText(m.mainText, px(textX), px(baselineY));

  activeCtx.font = L.fontSeriesScoreSuffix;
  activeCtx.fillStyle = "rgba(255,255,255,.85)";
  activeCtx.fillText(m.suffixText, px(textX + m.mMainW), px(baselineY));

  activeCtx.font = L.fontSeriesMeta;
  activeCtx.fillStyle = "rgba(255,255,255,.55)";
  activeCtx.fillText(m.metaText, px(textX + m.mMainW + m.mSuffixW), px(baselineY));

  activeCtx.restore();
}

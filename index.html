function exportPNG(){
  const scale = EXPORT_SCALE;

  const src = canvas;
  const exportCanvas = document.createElement("canvas");
  exportCanvas.width = Math.round(src.width * scale);
  exportCanvas.height = Math.round(src.height * scale);

  const ectx = exportCanvas.getContext("2d", { alpha: true });

  ectx.setTransform(scale, 0, 0, scale, 0, 0);
  ectx.imageSmoothingEnabled = true;
  ectx.imageSmoothingQuality = "high";
  ectx.drawImage(src, 0, 0);

  const filename =
    displayMode === "graph"
      ? (graphView === "seasonal"
          ? "series_graph_seasonal.png"
          : "series_graph_episodic.png")
      : displayMode === "cards"
        ? "series_cards.png"
        : gridWrapped
          ? "series_grid_wrapped.png"
          : gridView === "inverted"
            ? "series_grid_inverted.png"
            : "series_grid.png";

  exportCanvas.toBlob((blob) => {
    if (!blob) return;

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;

    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }, "image/png");
}

function fileToImage(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = (e) => { URL.revokeObjectURL(url); reject(e); };
    img.src = url;
  });
}

/* =========================
   IMDb / OMDb IMPORT
========================= */

function setImdbStatus(message, isError = false){
  imdbStatusEl.textContent = message;
  imdbStatusEl.dataset.error = String(isError);
}

function extractImdbId(value){
  const match = String(value)
    .trim()
    .match(/\btt\d{7,}\b/i);

  if (!match){
    throw new Error(
      "Enter a valid IMDb series ID, for example tt0903747."
    );
  }

  return match[0].toLowerCase();
}

async function omdbRequest(parameters){
  if (
    !OMDB_API_KEY ||
    OMDB_API_KEY === "PUT_YOUR_OMDB_API_KEY_HERE"
  ){
    throw new Error(
      "Add your OMDb API key to OMDB_API_KEY."
    );
  }

  const url = new URL("https://www.omdbapi.com/");
  url.searchParams.set("apikey", OMDB_API_KEY);

  for (const [key, value] of Object.entries(parameters)){
    if (value !== undefined && value !== null){
      url.searchParams.set(key, String(value));
    }
  }

  let response;

  try{
    response = await fetch(url.toString(), {
      method: "GET",
      headers: {
        Accept: "application/json"
      }
    });
  }catch(error){
    throw new Error(
      "Could not connect to OMDb. Check your connection and API key."
    );
  }

  if (!response.ok){
    throw new Error(
      `OMDb request failed with HTTP status ${response.status}.`
    );
  }

  let data;

  try{
    data = await response.json();
  }catch(error){
    throw new Error(
      "OMDb returned an invalid JSON response."
    );
  }

  if (!data || data.Response === "False"){
    throw new Error(
      data?.Error || "OMDb returned no data."
    );
  }

  return data;
}

function normalizeOmdbRating(value){
  if (typeof value !== "string"){
    return null;
  }

  const normalized = value.trim();

  if (
    normalized === "" ||
    normalized.toUpperCase() === "N/A"
  ){
    return null;
  }

  const rating = Number.parseFloat(normalized);

  if (
    !Number.isFinite(rating) ||
    rating < MIN_SCORE ||
    rating > MAX_SCORE
  ){
    return null;
  }

  return rating.toFixed(1);
}

function buildOmdbMatrix(seasons, mode){
  const processedSeasons = seasons
    .map(season => {
      const episodes = Array.isArray(season.episodes)
        ? season.episodes
            .map(episode => {
              const episodeNumber = Number.parseInt(
                episode.Episode,
                10
              );

              if (
                !Number.isInteger(episodeNumber) ||
                episodeNumber < 1
              ){
                return null;
              }

              return {
                episodeNumber,
                rating: normalizeOmdbRating(
                  episode.imdbRating
                )
              };
            })
            .filter(Boolean)
            .sort(
              (a, b) =>
                a.episodeNumber - b.episodeNumber
            )
        : [];

      return {
        seasonNumber: season.seasonNumber,
        episodes
      };
    })
    .filter(
      season =>
        Number.isInteger(season.seasonNumber) &&
        season.episodes.length > 0
    )
    .sort(
      (a, b) =>
        a.seasonNumber - b.seasonNumber
    );

  if (processedSeasons.length === 0){
    throw new Error(
      "OMDb returned no numbered episodes for this series."
    );
  }

  const maximumEpisodeNumber = Math.max(
    ...processedSeasons.flatMap(
      season =>
        season.episodes.map(
          episode => episode.episodeNumber
        )
    )
  );

  const episodeMaps = processedSeasons.map(
    season =>
      new Map(
        season.episodes.map(
          episode => [
            episode.episodeNumber,
            episode
          ]
        )
      )
  );

  const lines = [
    processedSeasons
      .map(
        season => `S${season.seasonNumber}`
      )
      .join(",")
  ];

  for (
    let episodeNumber = 1;
    episodeNumber <= maximumEpisodeNumber;
    episodeNumber += 1
  ){
    const row = processedSeasons.map(
      (season, seasonIndex) => {
        const episode = episodeMaps[
          seasonIndex
        ].get(episodeNumber);

        /*
  No episode exists at this position in this season.
  Leave the CSV cell empty.
*/
if (!episode){
  return "";
}

/*
  Empty-template mode marks every existing episode
  as unknown.
*/
if (mode === "E"){
  return "X";
}

/*
  The episode exists, but OMDb has no rating.
  Display it as an unknown episode.
*/
return episode.rating ?? "X";
      }
    );

    lines.push(row.join(","));
  }

  return lines.join("\n");
}

async function fetchSeriesFromOmdb(){
  if (fetchImdbBtn.disabled){
    return;
  }

  const previousButtonText =
    fetchImdbBtn.textContent;

  try{
    fetchImdbBtn.disabled = true;
    fetchImdbBtn.textContent = "Fetching…";

    setImdbStatus("Checking the series…");

    const imdbId = extractImdbId(
      imdbSeriesIdEl.value
    );

    const mode =
      imdbOutputModeEl.value === "E"
        ? "E"
        : "N";

    const series = await omdbRequest({
      i: imdbId,
      plot: "short"
    });

    if (
      typeof series.Type === "string" &&
      !["series", "episode"].includes(
        series.Type.toLowerCase()
      )
    ){
      throw new Error(
        "The IMDb ID does not appear to belong to a television series."
      );
    }

    const totalSeasons = Number.parseInt(
      series.totalSeasons,
      10
    );

    if (
      !Number.isInteger(totalSeasons) ||
      totalSeasons < 1
    ){
      throw new Error(
        "OMDb did not return a valid season count for this title."
      );
    }

    const seasons = [];
    const failedSeasons = [];

    for (
      let seasonNumber = 1;
      seasonNumber <= totalSeasons;
      seasonNumber += 1
    ){
      setImdbStatus(
        `Fetching season ${seasonNumber} of ${totalSeasons}…`
      );

      try{
        const seasonData = await omdbRequest({
          i: imdbId,
          Season: seasonNumber
        });

        const episodes =
          Array.isArray(seasonData.Episodes)
            ? seasonData.Episodes
            : [];

        if (episodes.length === 0){
          failedSeasons.push(seasonNumber);
          continue;
        }

        seasons.push({
          seasonNumber,
          episodes
        });
      }catch(error){
        failedSeasons.push(seasonNumber);

        console.warn(
          `Could not load season ${seasonNumber}:`,
          error
        );
      }
    }

    if (seasons.length === 0){
      throw new Error(
        "OMDb did not return any usable seasons."
      );
    }

    const output = buildOmdbMatrix(
      seasons,
      mode
    );

    /*
      This is the correct integration point for
      the rest of your application.
    */
    csvEl.value = output;

    /*
      Programmatically setting textarea.value does
      not fire an input event, so render() must be
      called explicitly.
    */
    render();

    const loadedEpisodeCount = seasons.reduce(
      (total, season) =>
        total + season.episodes.length,
      0
    );

    let message =
      `Loaded ${series.Title || imdbId}: ` +
      `${seasons.length} season` +
      `${seasons.length === 1 ? "" : "s"}, ` +
      `${loadedEpisodeCount} episode` +
      `${loadedEpisodeCount === 1 ? "" : "s"}.`;

    if (failedSeasons.length > 0){
      message +=
        ` Could not load season` +
        `${failedSeasons.length === 1 ? "" : "s"} ` +
        `${failedSeasons.join(", ")}.`;
    }

    setImdbStatus(message);
  }catch(error){
    console.error(
      "IMDb/OMDb import failed:",
      error
    );

    setImdbStatus(
      error instanceof Error
        ? error.message
        : "An unexpected import error occurred.",
      true
    );
  }finally{
    fetchImdbBtn.disabled = false;
    fetchImdbBtn.textContent =
      previousButtonText || "Fetch episodes";
  }
}

  render();
});

graphModeBtn.addEventListener("click", () => {
  displayMode = "graph";
  syncDisplayUI();
  render();
});

gridViewSelect.addEventListener("change", () => {
  gridView =
    gridViewSelect.value === "inverted"
      ? "inverted"
      : "default";

  render();
});

gridWrappedBtn.addEventListener("click", () => {
  gridWrapped = !gridWrapped;

  gridWrappedBtn.setAttribute(
    "aria-checked",
    gridWrapped ? "true" : "false"
  );

  render();
});

graphViewSelect.addEventListener("change", () => {
  graphView = graphViewSelect.value === "seasonal"
    ? "seasonal"
    : "episodic";
  render();
});

trendlineBtn.addEventListener("click", () => {
  graphTrendline = !graphTrendline;
  syncDisplayUI();
  render();
});

/* init */
buildLegend();
syncDisplayUI();
render();
</script>
